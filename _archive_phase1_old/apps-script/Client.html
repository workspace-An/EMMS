<script>
/*
 * Client.html - inti aplikasi sisi browser: utilitas DOM aman (tanpa innerHTML untuk data),
 * pemanggil API, i18n, login OTP, shell (sidebar/topbar), router, modal, form, toast.
 * Halaman ada di Dashboard.html, Equipment.html, Admin.html (mendaftar ke EMMS.pages).
 */
(function () {
  'use strict';
  var E = window.EMMS = { pages: {} };
  var BOOT = window.BOOT || {};
  var S = E.S = { token: null, me: null, perms: [], lang: 'id', route: 'dashboard', master: null, navOpen: false, tok: 0, appUrl: '', els: {}, pending: null };

  // ------------------------------------------------------------------ penyimpanan (aman bila diblokir)
  var mem = {};
  function store(kind) {
    return {
      get: function (k) { try { var v = window[kind].getItem(k); return v === null ? (mem[kind + k] || null) : v; } catch (e) { return mem[kind + k] || null; } },
      set: function (k, v) { mem[kind + k] = v; try { window[kind].setItem(k, v); } catch (e) { /* diabaikan */ } },
      del: function (k) { delete mem[kind + k]; try { window[kind].removeItem(k); } catch (e) { /* diabaikan */ } }
    };
  }
  var LS = store('localStorage'), SS = store('sessionStorage');

  // ------------------------------------------------------------------ DOM
  function $(sel, root) { return (root || document).querySelector(sel); }
  function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); return el; }
  function append(el, c) {
    if (c === null || c === undefined || c === false) return;
    if (Array.isArray(c)) { c.forEach(function (x) { append(el, x); }); return; }
    el.appendChild(c.nodeType ? c : document.createTextNode(String(c)));
  }
  function h(tag, attrs) {
    var el = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v === null || v === undefined || v === false) return;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k.slice(0, 2) === 'on' && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else if (k === 'value' || k === 'checked' || k === 'disabled' || k === 'selected') el[k] = v;
      else el.setAttribute(k, v === true ? '' : v);
    });
    for (var i = 2; i < arguments.length; i++) append(el, arguments[i]);
    return el;
  }

  var ICONS = {
    grid: '<rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/>',
    zap: '<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',
    clip: '<path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M9 14l2 2 4-4"/>',
    cal: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
    tool: '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',
    file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/>',
    shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
    box: '<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.27 6.96L12 12.01l8.73-5.05M12 22.08V12"/>',
    chart: '<path d="M18 20V10M12 20V4M6 20v-6"/>',
    users: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
    sliders: '<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
    menu: '<path d="M3 12h18M3 6h18M3 18h18"/>',
    x: '<path d="M18 6L6 18M6 6l12 12"/>',
    search: '<circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    printer: '<path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>',
    logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
    download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
    camera: '<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>',
    edit: '<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
    trash: '<path d="M3 6h18M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>',
    refresh: '<path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>',
    bolt: '<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>'
  };
  function ic(name) {
    var d = document.createElement('div');
    d.innerHTML = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' + (ICONS[name] || '') + '</svg>';
    return d.firstChild;
  }

  // ------------------------------------------------------------------ i18n
  function t(key, params) {
    var d = I18N[S.lang] || I18N.id, s = d[key];
    if (s === undefined) s = I18N.id[key];
    if (s === undefined) return key;
    if (params) s = s.replace(/\{(\w+)\}/g, function (m, k) { return params[k] !== undefined ? params[k] : m; });
    return s;
  }
  function tOr(key, fallback, params) { return (I18N.id[key] === undefined) ? fallback : t(key, params); }
  function fieldLabel(f) { return tOr('f.' + f, f); }

  function errText(e) {
    if (!e) return t('err.SERVER_ERROR');
    var code = e.code || 'SERVER_ERROR', base;
    if (code === 'VALIDATION' && e.details) {
      var rule = e.details.rule;
      base = t('err.VALIDATION') + ': ' + fieldLabel(e.details.field) + ' ' + tOr('rule.' + rule, rule || '', e.details);
    } else if (I18N.id['err.' + code] !== undefined) {
      base = t('err.' + code);
    } else {
      base = e.message || t('err.SERVER_ERROR');
    }
    if (code === 'SERVER_ERROR' && e.details && e.details.ref) base += ' (Ref: ' + e.details.ref + ')';
    return base;
  }

  // ------------------------------------------------------------------ API
  var inflight = 0;
  function busy(d) {
    inflight = Math.max(0, inflight + d);
    var b = $('#busy'); if (b) b.classList.toggle('on', inflight > 0);
  }
  var AUTH_CODES = { AUTH_REQUIRED: 1, TOKEN_EXPIRED: 1, ACCOUNT_DISABLED: 1 };

  function api(action, payload, opts) {
    opts = opts || {};
    return new Promise(function (resolve, reject) {
      busy(1);
      var req = { action: action, payload: payload || {}, token: S.token || '' };
      try {
        google.script.run
          .withSuccessHandler(function (res) {
            busy(-1);
            if (res && res.ok) return resolve(res.data);
            var err = res || { code: 'SERVER_ERROR' };
            if (AUTH_CODES[err.code] && !opts.noAutoLogout) forceLogout(err.code);
            reject(err);
          })
          .withFailureHandler(function (e) {
            busy(-1);
            reject({ code: 'NETWORK', message: e && e.message });
          })
          .api(req);
      } catch (ex) {
        busy(-1);
        reject({ code: 'NETWORK', message: String(ex) });
      }
    });
  }

  // ------------------------------------------------------------------ UI: toast / modal / confirm
  function toast(msg, kind) {
    var el = h('div', { class: 'toast ' + (kind || ''), role: kind === 'bad' ? 'alert' : 'status' }, msg);
    $('#toasts').appendChild(el);
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, kind === 'bad' ? 7000 : 3500);
  }
  function fail(e) { toast(errText(e), 'bad'); }

  var modalStack = [];
  function openModal(o) {
    var close, closeBtn = h('button', { class: 'x', type: 'button', 'aria-label': t('c.close'), onclick: function () { close(); } }, ic('x'));
    var titleEl = h('h2', null, o.title || '');
    var body = h('div', { class: 'modal-b' }, o.body);
    var foot = o.footer && o.footer.length ? h('div', { class: 'modal-f' }, o.footer) : null;
    var modal = h('div', { class: 'modal' + (o.wide ? ' wide' : '') }, h('div', { class: 'modal-h' }, titleEl, closeBtn), body, foot);
    var overlay = h('div', { class: 'overlay', role: 'dialog', 'aria-modal': 'true' }, modal);
    var downOnOverlay = false;
    overlay.addEventListener('mousedown', function (ev) { downOnOverlay = ev.target === overlay; });
    overlay.addEventListener('mouseup', function (ev) { if (downOnOverlay && ev.target === overlay && !o.sticky) close(); });
    var handle = {
      el: modal, body: body, footer: foot, setTitle: function (s) { titleEl.textContent = s; },
      close: function () { close(); }
    };
    close = function () {
      if (!overlay.parentNode) return;
      overlay.parentNode.removeChild(overlay);
      modalStack = modalStack.filter(function (m) { return m !== handle; });
      if (!modalStack.length) document.body.style.overflow = '';
      if (o.onClose) o.onClose();
    };
    $('#modal-root').appendChild(overlay);
    modalStack.push(handle);
    document.body.style.overflow = 'hidden';
    var first = overlay.querySelector('input:not([disabled]), select:not([disabled]), textarea');
    if (first && !o.noFocus) setTimeout(function () { try { first.focus(); } catch (e) { /* abaikan */ } }, 30);
    return handle;
  }
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && modalStack.length) modalStack[modalStack.length - 1].close();
  });

  function confirmBox(o) {
    return new Promise(function (resolve) {
      var done = false;
      function fin(v) { if (!done) { done = true; resolve(v); } }
      var m;
      var ok = h('button', { class: 'btn ' + (o.danger ? 'danger solid' : 'primary'), type: 'button', onclick: function () { fin(true); m.close(); } }, o.okLabel || t('c.save'));
      var cancel = h('button', { class: 'btn', type: 'button', onclick: function () { m.close(); } }, t('c.cancel'));
      m = openModal({ title: o.title, body: h('p', { style: 'margin:0' }, o.message), footer: [cancel, ok], onClose: function () { fin(false); }, noFocus: true });
    });
  }

  // ------------------------------------------------------------------ Form builder
  function setOptions(sel, options, value, blank) {
    clear(sel);
    if (blank !== false) sel.appendChild(h('option', { value: '' }, blank === undefined ? t('c.select') : blank));
    options.forEach(function (o) { sel.appendChild(h('option', { value: o[0] }, o[1])); });
    sel.value = value === undefined || value === null ? '' : value;
    if (sel.value !== String(value === undefined || value === null ? '' : value)) sel.value = '';
  }

  function buildForm(fields, vals) {
    vals = vals || {};
    var inputs = {}, errs = {}, wraps = {}, grid = h('div', { class: 'form-grid' });
    var form = { el: grid, inputs: inputs, setOptions: setOptions };
    fields.forEach(function (f) {
      var id = 'f_' + f.k + '_' + Math.floor(Math.random() * 1e6), inp;
      if (f.type === 'select') {
        inp = h('select', { id: id });
        setOptions(inp, f.options || [], vals[f.k], f.blank);
      } else if (f.type === 'textarea') {
        inp = h('textarea', { id: id, rows: 3, maxlength: f.max });
        inp.value = vals[f.k] == null ? '' : vals[f.k];
      } else {
        inp = h('input', { id: id, type: f.type || 'text', maxlength: f.max, autocomplete: 'off', inputmode: f.inputmode, placeholder: f.ph, min: f.min, spellcheck: 'false' });
        inp.value = vals[f.k] == null ? '' : vals[f.k];
      }
      if (f.disabled) inp.disabled = true;
      if (f.autocap) inp.addEventListener('input', function () { inp.value = inp.value.toUpperCase(); });
      inputs[f.k] = inp;
      errs[f.k] = h('div', { class: 'err', role: 'alert' });
      if (f.onChange) inp.addEventListener('change', function () { f.onChange(inp.value, form); });
      var wrap = h('div', { class: 'field' + (f.span === 2 ? ' span2' : '') },
        h('label', { for: id }, f.label ? f.label : fieldLabel(f.k), f.req ? h('span', { class: 'req' }, ' *') : null),
        inp, f.hint ? h('div', { class: 'small muted' }, f.hint) : null, errs[f.k]);
      wraps[f.k] = wrap;
      grid.appendChild(wrap);
    });
    form.get = function () {
      var o = {};
      Object.keys(inputs).forEach(function (k) { o[k] = inputs[k].type === 'checkbox' ? inputs[k].checked : String(inputs[k].value).trim(); });
      return o;
    };
    form.clearErrors = function () {
      Object.keys(errs).forEach(function (k) { errs[k].textContent = ''; wraps[k].classList.remove('bad'); });
    };
    form.setError = function (k, msg) {
      if (!errs[k]) return false;
      errs[k].textContent = msg; wraps[k].classList.add('bad');
      try { inputs[k].focus(); } catch (e) { /* abaikan */ }
      return true;
    };
    // Validasi ringan di klien (server tetap otoritatif).
    form.validate = function () {
      form.clearErrors();
      var ok = true;
      fields.forEach(function (f) {
        if (f.req && !String(inputs[f.k].value).trim()) {
          errs[f.k].textContent = fieldLabel(f.k) + ' ' + t('rule.required'); wraps[f.k].classList.add('bad'); ok = false;
        }
      });
      if (!ok) { var bad = grid.querySelector('.field.bad input, .field.bad select, .field.bad textarea'); if (bad) bad.focus(); }
      return ok;
    };
    // Tampilkan galat server pada kolom yang sesuai; kembalikan true bila tertangani.
    form.showServerError = function (e) {
      if (e && e.code === 'VALIDATION' && e.details && e.details.field) {
        return form.setError(e.details.field, fieldLabel(e.details.field) + ' ' + tOr('rule.' + e.details.rule, e.details.rule || '', e.details));
      }
      return false;
    };
    return form;
  }

  // ------------------------------------------------------------------ Komponen kecil
  function can(p) { return S.perms.indexOf(p) >= 0; }
  function badge(kind, text) { return h('span', { class: 'badge ' + kind }, text); }
  var STATUS_KIND = { Normal: 'ok', Warning: 'warn', Breakdown: 'bad' };
  var COND_KIND = { Good: 'ok', Fair: 'info', Poor: 'warn', Critical: 'bad' };
  function statusBadge(s) { return badge(STATUS_KIND[s] || 'off', tOr('st.' + s, s)); }
  function condBadge(c) { return badge(COND_KIND[c] || 'off', tOr('cond.' + c, c)); }
  function activeBadge(s) { return badge(s === 'Active' ? 'ok' : 'off', tOr('rs.' + s, s)); }
  function fmtDT(s) { return s ? String(s).slice(0, 16) : ''; }
  function initials(n) { return String(n || '?').trim().split(/\s+/).slice(0, 2).map(function (w) { return w.charAt(0).toUpperCase(); }).join(''); }
  function btn(label, o) {
    o = o || {};
    return h('button', { type: o.type || 'button', class: 'btn' + (o.cls ? ' ' + o.cls : ''), onclick: o.onclick, disabled: o.disabled, title: o.title, 'aria-label': o.aria },
      o.icon ? ic(o.icon) : null, label);
  }
  function empty(title, sub) { return h('div', { class: 'empty' }, h('b', null, title), sub || ''); }

  /** Tabel responsif: di layar kecil berubah menjadi kartu (data-label). */
  function table(cols, rows, o) {
    o = o || {};
    var thead = h('thead', null, h('tr', null, cols.map(function (c) { return h('th', { class: c.cls || '' }, c.label || ''); })));
    var tbody = h('tbody');
    rows.forEach(function (r) {
      var tr = h('tr', { class: (o.onRow ? 'click ' : '') + (o.rowClass ? o.rowClass(r) : '') });
      if (o.onRow) {
        tr.tabIndex = 0;
        tr.addEventListener('click', function (ev) { if (!ev.target.closest('button, a, input, select')) o.onRow(r); });
        tr.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' && ev.target === tr) o.onRow(r); });
      }
      cols.forEach(function (c, i) {
        var v = c.render(r);
        tr.appendChild(h('td', { 'data-label': c.label || '', class: (c.cls || '') + (i === 0 ? ' first' : '') }, v));
      });
      tbody.appendChild(tr);
    });
    return h('div', { class: 'tbl-wrap' }, h('table', { class: 'tbl cards' }, thead, tbody));
  }

  function pageHead(title, sub, actions) {
    return h('div', { class: 'page-head' }, h('div', null, h('h1', null, title), sub ? h('p', null, sub) : null),
      actions && actions.length ? h('div', { class: 'row-gap' }, actions) : null);
  }

  function copyText(text) {
    function fallback() {
      var ta = h('textarea', { style: 'position:fixed;opacity:0' }); ta.value = text; document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) { /* abaikan */ }
      document.body.removeChild(ta); return ok;
    }
    return new Promise(function (resolve) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { resolve(true); }, function () { resolve(fallback()); });
      } else resolve(fallback());
    });
  }

  function printNode(node) {
    var area = $('#print-area'); clear(area); area.appendChild(node);
    var cleaned = false;
    function done() { if (cleaned) return; cleaned = true; clear(area); window.removeEventListener('afterprint', done); }
    window.addEventListener('afterprint', done);
    setTimeout(function () { try { window.print(); } catch (e) { done(); } }, 60);
    setTimeout(done, 120000);
  }

  /** Perkecil foto (maks 1280px) dan ubah ke JPEG agar ringan diunggah. */
  function imageToJpeg(file, maxDim, quality) {
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onerror = function () { reject({ code: 'FILE_INVALID' }); };
      fr.onload = function () {
        var img = new Image();
        img.onerror = function () { reject({ code: 'FILE_INVALID' }); };
        img.onload = function () {
          var w = img.naturalWidth, hh = img.naturalHeight, sc = Math.min(1, maxDim / Math.max(w, hh));
          var c = document.createElement('canvas'); c.width = Math.round(w * sc); c.height = Math.round(hh * sc);
          var ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
          var q = quality, out = c.toDataURL('image/jpeg', q);
          while (out.length * 0.75 > 2.5 * 1024 * 1024 && q > 0.4) { q -= 0.1; out = c.toDataURL('image/jpeg', q); }
          if (out.length * 0.75 > 2.9 * 1024 * 1024) return reject({ code: 'FILE_TOO_LARGE' });
          resolve(out);
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }

  // ------------------------------------------------------------------ Master data (cache)
  function loadMaster(force) {
    if (S.master && !force) return Promise.resolve(S.master);
    return api('master.all').then(function (m) { S.master = m; return m; });
  }
  function byId(list, key, id) { for (var i = 0; i < list.length; i++) if (list[i][key] === id) return list[i]; return null; }
  function catLabel(c) { return c ? (c['name_' + S.lang] || c.name_en || c.code) : ''; }
  function catById(id) { return S.master ? byId(S.master.categories, 'category_id', id) : null; }
  function bldById(id) { return S.master ? byId(S.master.buildings, 'building_id', id) : null; }
  function locById(id) { return S.master ? byId(S.master.locations, 'location_id', id) : null; }

  // ------------------------------------------------------------------ Bahasa
  function setLang(l, persist) {
    if (!I18N[l]) l = 'id';
    S.lang = l;
    LS.set('emms.lang', l);
    document.documentElement.lang = l === 'zh' ? 'zh-CN' : l;
    document.title = 'EMMS';
    if (persist && S.token) api('auth.setLanguage', { language: l }, { noAutoLogout: true }).catch(function () { /* bukan masalah kritis */ });
  }
  function langSelect(onchange, cls) {
    var sel = h('select', { class: 'lang ' + (cls || ''), 'aria-label': t('c.language') });
    ['id', 'en', 'zh'].forEach(function (l) { sel.appendChild(h('option', { value: l }, I18N[l]['lang.' + l])); });
    sel.value = S.lang;
    sel.addEventListener('change', function () { onchange(sel.value); });
    return sel;
  }

  // ------------------------------------------------------------------ Login
  function renderSetupNeeded() {
    var app = clear($('#app'));
    app.appendChild(h('div', { class: 'login' },
      h('div', { class: 'login-form', style: 'grid-column:1/-1' },
        h('div', { class: 'login-box' }, h('h1', null, t('login.notsetup_t')), h('div', { class: 'notice warn' }, t('login.notsetup_b'))))));
  }

  function renderLogin(message) {
    clear($('#app'));
    var step = 'email', email = '', ttl = 10, timer = null, sending = false;
    var box = h('div', { class: 'login-box' });
    var wrap = h('div', { class: 'login-form', style: 'position:relative' },
      h('div', { class: 'login-lang' }, langSelect(function (l) { S.langChosenLocally = true; setLang(l, false); if (timer) clearInterval(timer); renderLogin(message); })), box);
    $('#app').appendChild(h('div', { class: 'login' },
      h('div', { class: 'login-art' },
        h('div', { class: 'brand' }, h('div', { class: 'logo' }, ic('bolt')), h('div', null, h('b', null, 'EMMS'), h('span', null, BOOT.company || ''))),
        h('div', null, h('h2', null, t('login.art_h')), h('p', null, t('login.art_p')),
          h('ul', null, h('li', null, t('login.art_1')), h('li', null, t('login.art_2')), h('li', null, t('login.art_3')))),
        h('div', { class: 'small', style: 'color:#64748b' }, 'v' + (BOOT.version || ''))),
      wrap));

    function draw() {
      clear(box);
      if (timer) { clearInterval(timer); timer = null; }
      box.appendChild(h('div', null, h('h1', null, t('login.title')), h('p', { class: 'muted', style: 'margin:6px 0 0' }, step === 'email' ? t('login.sub') : t('login.sent', { n: ttl }))));
      if (message && step === 'email') box.appendChild(h('div', { class: 'notice warn', role: 'alert' }, message));
      var err = h('div', { class: 'err', role: 'alert', style: 'font-size:13px' });
      if (step === 'email') {
        var inp = h('input', { type: 'email', id: 'lg_email', autocomplete: 'email', inputmode: 'email', placeholder: 'nama@gmail.com', spellcheck: 'false', autocapitalize: 'none' });
        inp.value = email;
        var go = h('button', { class: 'btn primary block', type: 'submit' }, t('login.send'));
        var f = h('form', { class: 'stack', novalidate: 'novalidate' },
          h('div', { class: 'field' }, h('label', { for: 'lg_email' }, t('login.email')), inp), err, go);
        f.addEventListener('submit', function (ev) {
          ev.preventDefault();
          if (sending) return;
          email = inp.value.trim().toLowerCase(); err.textContent = '';
          if (!email) { err.textContent = t('err.INVALID_EMAIL'); return; }
          sending = true; go.disabled = true;
          api('auth.requestOtp', { email: email, lang: S.lang }, { noAutoLogout: true }).then(function (r) {
            ttl = r.ttlMinutes || 10; step = 'code'; message = ''; sending = false; draw();
          }, function (e) { sending = false; go.disabled = false; err.textContent = errText(e); });
        });
        box.appendChild(f);
        setTimeout(function () { try { inp.focus(); } catch (e) { /* abaikan */ } }, 50);
      } else {
        var code = h('input', { type: 'text', class: 'code-in', id: 'lg_code', inputmode: 'numeric', autocomplete: 'one-time-code', maxlength: 6, placeholder: '••••••', 'aria-label': t('login.code') });
        var rem = h('input', { type: 'checkbox', id: 'lg_rem' });
        var verify = h('button', { class: 'btn primary block', type: 'submit' }, t('login.verify'));
        var resend = h('button', { class: 'btn ghost sm', type: 'button' }, t('login.resend'));
        var back = h('button', { class: 'btn ghost sm', type: 'button', onclick: function () { step = 'email'; draw(); } }, t('login.change_email'));
        var f2 = h('form', { class: 'stack', novalidate: 'novalidate' },
          h('div', { class: 'small muted' }, email),
          h('div', { class: 'field' }, h('label', { for: 'lg_code' }, t('login.code')), code),
          h('label', { class: 'check', for: 'lg_rem' }, rem, t('login.remember')), err, verify,
          h('div', { class: 'row-gap', style: 'justify-content:space-between' }, back, resend));
        var verifying = false;
        function submit() {
          if (verifying) return;
          var c = code.value.replace(/\D/g, '');
          if (c.length !== 6) { err.textContent = t('err.OTP_INVALID'); return; }
          verifying = true; verify.disabled = true; err.textContent = '';
          api('auth.verifyOtp', { email: email, code: c, remember: rem.checked }, { noAutoLogout: true }).then(function (r) {
            S.token = r.token;
            (rem.checked ? LS : SS).set('emms.token', r.token);
            (rem.checked ? SS : LS).del('emms.token');
            applyMe(r.me);
            enterApp();
          }, function (e) { verifying = false; verify.disabled = false; code.select(); err.textContent = errText(e); });
        }
        f2.addEventListener('submit', function (ev) { ev.preventDefault(); submit(); });
        code.addEventListener('input', function () { code.value = code.value.replace(/\D/g, '').slice(0, 6); if (code.value.length === 6) submit(); });
        var left = 30;
        function tick() {
          resend.disabled = left > 0;
          resend.textContent = left > 0 ? t('login.resend_in', { n: left }) : t('login.resend');
        }
        tick();
        timer = setInterval(function () { left = Math.max(0, left - 1); tick(); }, 1000);
        resend.addEventListener('click', function () {
          resend.disabled = true;
          api('auth.requestOtp', { email: email, lang: S.lang }, { noAutoLogout: true }).then(function () { left = 30; tick(); toast(t('login.sent', { n: ttl })); }, function (e) { err.textContent = errText(e); left = 5; tick(); });
        });
        box.appendChild(f2);
        setTimeout(function () { try { code.focus(); } catch (e) { /* abaikan */ } }, 50);
      }
    }
    draw();
  }

  function forceLogout(code) {
    if (!S.token && !S.me) return;
    S.token = null; S.me = null; S.perms = []; S.master = null;
    LS.del('emms.token'); SS.del('emms.token');
    while (modalStack.length) modalStack[modalStack.length - 1].close();
    renderLogin(t(code === 'ACCOUNT_DISABLED' ? 'err.ACCOUNT_DISABLED' : 'session.expired'));
  }

  function logout() {
    var tk = S.token;
    api('auth.logout', {}, { noAutoLogout: true }).then(function () {}, function () {}).then(function () {
      S.token = null; S.me = null; S.perms = []; S.master = null;
      LS.del('emms.token'); SS.del('emms.token');
      void tk;
      renderLogin('');
    });
  }

  function applyMe(me) {
    S.me = me.user; S.perms = me.permissions || []; S.appUrl = me.appUrl || BOOT.appUrl || '';
    S.company = (me.settings && me.settings.companyName) || BOOT.company || '';
    if (me.user.language && !S.langChosenLocally) setLang(me.user.language, false);
  }

  // ------------------------------------------------------------------ Shell & router
  var NAV = [
    { g: 'nav.g_main', items: [
      { id: 'dashboard', icon: 'grid', perm: 'dashboard.read' },
      { id: 'equipment', icon: 'zap', perm: 'equipment.read' }] },
    { g: 'nav.g_ops', items: [
      { id: 'inspection', icon: 'clip', phase: 2 }, { id: 'pm', icon: 'cal', phase: 3 }, { id: 'cm', icon: 'tool', phase: 4 },
      { id: 'wo', icon: 'file', phase: 4 }, { id: 'safety', icon: 'shield', phase: 5 }, { id: 'inventory', icon: 'box', phase: 6 },
      { id: 'reports', icon: 'chart', phase: 8 }] },
    { g: 'nav.g_admin', items: [
      { id: 'users', icon: 'users', perm: 'users.read' }, { id: 'settings', icon: 'sliders', perm: 'settings.read' }] }
  ];
  var PHASE = {};
  NAV.forEach(function (g) { g.items.forEach(function (i) { if (i.phase) PHASE[i.id] = i.phase; }); });

  function renderShell() {
    var app = clear($('#app'));
    var sidebar = h('aside', { class: 'sidebar', 'aria-label': t('nav.menu') },
      h('div', { class: 'brand' }, h('div', { class: 'logo' }, ic('bolt')), h('div', null, h('b', null, 'EMMS'), h('span', { title: S.company }, S.company))),
      h('nav', { class: 'nav' }, NAV.map(function (g) {
        var items = g.items.filter(function (i) { return !i.perm || can(i.perm); });
        if (!items.length) return null;
        return [h('div', { class: 'grp' }, t(g.g)), items.map(function (i) {
          var a = h('a', { href: '#', 'data-route': i.id, onclick: function (ev) { ev.preventDefault(); go(i.id); } }, ic(i.icon), t('nav.' + i.id),
            i.phase ? h('span', { class: 'tag' }, 'P' + i.phase) : null);
          if (i.id === S.route) { a.classList.add('active'); a.setAttribute('aria-current', 'page'); }
          return a;
        })];
      })),
      h('div', { class: 'side-foot' }, 'EMMS v' + (BOOT.version || '')));
    var title = h('h1', null, '');
    var content = h('main', { class: 'content', id: 'content', tabindex: '-1' });
    var burger = h('button', { class: 'btn ghost burger', type: 'button', 'aria-label': t('nav.menu'), onclick: function () { toggleNav(); } }, ic('menu'));
    var topbar = h('header', { class: 'topbar' }, burger, title,
      langSelect(function (l) { S.langChosenLocally = true; setLang(l, true); renderShell(); go(S.route, S.pending); }),
      h('div', { class: 'user-chip' },
        h('div', { class: 'who' }, h('b', null, S.me.full_name), h('span', null, t('role.' + S.me.role))),
        h('div', { class: 'avatar', 'aria-hidden': 'true' }, initials(S.me.full_name))),
      h('button', { class: 'btn ghost', type: 'button', title: t('logout'), 'aria-label': t('logout'), onclick: logout }, ic('logout')));
    var backdrop = h('div', { class: 'backdrop', onclick: function () { toggleNav(false); } });
    var shell = h('div', { class: 'shell' + (S.navOpen ? ' nav-open' : '') }, sidebar, backdrop, h('div', { class: 'main' }, topbar, content));
    app.appendChild(shell);
    S.els = { shell: shell, title: title, content: content, sidebar: sidebar };
  }

  function toggleNav(force) {
    S.navOpen = force === undefined ? !S.navOpen : !!force;
    if (S.els.shell) S.els.shell.classList.toggle('nav-open', S.navOpen);
  }

  function renderPlaceholder(el, id) {
    var ph = PHASE[id];
    el.appendChild(pageHead(t('nav.' + id)));
    el.appendChild(h('div', { class: 'card' }, h('div', { class: 'card-b stack' },
      h('div', { class: 'row-gap' }, badge('info', t('c.phase', { n: ph })), h('b', null, t('ph.title', { n: ph }))),
      h('p', { class: 'muted', style: 'margin:0' }, t('ph.body')),
      h('div', null, h('div', { class: 'small muted', style: 'text-transform:uppercase;letter-spacing:.04em;font-weight:650;margin-bottom:4px' }, t('ph.what')), h('div', null, t('ph.' + id))))));
  }

  function go(route, opts) {
    var allowed = false;
    NAV.forEach(function (g) { g.items.forEach(function (i) { if (i.id === route && (!i.perm || can(i.perm))) allowed = true; }); });
    if (!allowed) route = 'dashboard';
    S.route = route; S.pending = opts || null;
    S.tok++;
    toggleNav(false);
    var el = S.els.content; if (!el) return;
    clear(el);
    S.els.title.textContent = t('nav.' + route);
    Array.prototype.forEach.call(S.els.sidebar.querySelectorAll('.nav a'), function (a) {
      var on = a.getAttribute('data-route') === route;
      a.classList.toggle('active', on);
      if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    window.scrollTo(0, 0);
    if (PHASE[route]) return renderPlaceholder(el, route);
    var page = E.pages[route];
    if (page) page.render(el, opts || {}, S.tok);
  }

  function isCurrent(tok) { return tok === S.tok; }

  function enterApp() {
    loadMaster(true).then(function () {
      renderShell();
      var opts = null, route = 'dashboard';
      if (BOOT.deepLink) { route = 'equipment'; opts = { open: BOOT.deepLink, scan: true }; BOOT.deepLink = ''; }
      go(route, opts);
    }, function (e) { if (!AUTH_CODES[e.code]) { renderLogin(errText(e)); } });
  }

  E.start = function () {
    var saved = LS.get('emms.lang');
    setLang(saved && I18N[saved] ? saved : (BOOT.defaultLang || 'id'), false);
    S.langChosenLocally = !!saved;
    if (!BOOT.ready) { renderSetupNeeded(); return; }
    var tk = SS.get('emms.token') || LS.get('emms.token');
    if (!tk) { renderLogin(''); return; }
    S.token = tk;
    api('auth.me', {}, { noAutoLogout: true }).then(function (me) { applyMe(me); enterApp(); },
      function (e) {
        S.token = null; LS.del('emms.token'); SS.del('emms.token');
        renderLogin(AUTH_CODES[e.code] ? t('session.expired') : errText(e));
      });
  };

  // ------------------------------------------------------------------ Ekspor untuk halaman
  E.$ = $; E.h = h; E.clear = clear; E.ic = ic; E.t = t; E.tOr = tOr; E.api = api; E.toast = toast; E.fail = fail; E.errText = errText;
  E.openModal = openModal; E.confirmBox = confirmBox; E.buildForm = buildForm; E.setOptions = setOptions; E.can = can;
  E.badge = badge; E.statusBadge = statusBadge; E.condBadge = condBadge; E.activeBadge = activeBadge; E.btn = btn; E.empty = empty;
  E.table = table; E.pageHead = pageHead; E.fmtDT = fmtDT; E.copyText = copyText; E.printNode = printNode; E.imageToJpeg = imageToJpeg;
  E.loadMaster = loadMaster; E.byId = byId; E.catLabel = catLabel; E.catById = catById; E.bldById = bldById; E.locById = locById;
  E.go = go; E.isCurrent = isCurrent; E.fieldLabel = fieldLabel; E.PHASE = PHASE; E.BOOT = BOOT;
  E.refreshShell = function () { renderShell(); go(S.route, S.pending); };
})();
</script>
