<script>
/* Dashboard.html - halaman Dashboard: kartu statistik, grafik SVG (tanpa library), aktivitas terbaru. */
(function () {
  'use strict';
  var E = window.EMMS, h = E.h, t = E.t;
  var NS = 'http://www.w3.org/2000/svg';
  function sv(tag, attrs) {
    var el = document.createElementNS(NS, tag);
    if (attrs) Object.keys(attrs).forEach(function (k) { el.setAttribute(k, attrs[k]); });
    for (var i = 2; i < arguments.length; i++) { var c = arguments[i]; if (c) el.appendChild(c.nodeType ? c : document.createTextNode(String(c))); }
    return el;
  }
  var C = { ok: '#16a34a', warn: '#d97706', bad: '#dc2626', blue: '#2563eb', orange: '#ea580c', grey: '#cbd5e1', info: '#2563eb' };

  function actionLabel(a) {
    if (I18N.id['act.' + a] !== undefined) return t('act.' + a);
    var m = /^([A-Z]+)_([A-Z_]+)$/.exec(a || '');
    if (m && I18N.id['ent.' + m[1]] !== undefined && I18N.id['verb.' + m[2]] !== undefined) return t('ent.' + m[1]) + ' ' + t('verb.' + m[2]);
    return a || '';
  }
  E.actionLabel = actionLabel;

  function legend(items) {
    return h('div', { class: 'legend' }, items.map(function (i) {
      return h('span', null, h('i', { style: 'background:' + i.color }), i.label + (i.value !== undefined ? ': ' + i.value : ''));
    }));
  }

  function donut(parts, total, aria) {
    var svg = sv('svg', { class: 'donut', viewBox: '0 0 42 42', role: 'img', 'aria-label': aria });
    svg.appendChild(sv('circle', { cx: 21, cy: 21, r: 15.9155, fill: 'none', stroke: '#e2e8f0', 'stroke-width': 6 }));
    var off = 25; // mulai dari jam 12
    if (total > 0) parts.forEach(function (p) {
      if (!p.value) return;
      var pct = p.value / total * 100;
      svg.appendChild(sv('circle', { cx: 21, cy: 21, r: 15.9155, fill: 'none', stroke: p.color, 'stroke-width': 6, 'stroke-dasharray': pct + ' ' + (100 - pct), 'stroke-dashoffset': off }));
      off -= pct;
    });
    svg.appendChild(sv('text', { x: 21, y: 22.5, 'text-anchor': 'middle', 'font-size': 8, 'font-weight': 700, fill: '#0f172a' }, String(total)));
    svg.appendChild(sv('text', { x: 21, y: 28, 'text-anchor': 'middle', 'font-size': 3.2, fill: '#64748b' }, t('d.total_label')));
    return svg;
  }

  function niceMax(v) { if (v <= 4) return 4; var p = Math.pow(10, Math.floor(Math.log(v) / Math.LN10)); return Math.ceil(v / p * 2) / 2 * p; }

  function monthlyChart(rows) {
    var W = 360, H = 170, L = 26, R = 6, T = 8, B = 22;
    var max = niceMax(Math.max.apply(null, rows.map(function (r) { return Math.max(r.pm, r.cm); }).concat([1])));
    var svg = sv('svg', { class: 'chart', viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': t('d.c_monthly') });
    for (var g = 0; g <= 4; g++) {
      var y = T + (H - T - B) * (1 - g / 4);
      svg.appendChild(sv('line', { x1: L, x2: W - R, y1: y, y2: y, stroke: '#e2e8f0', 'stroke-width': 1 }));
      svg.appendChild(sv('text', { x: L - 4, y: y + 3, 'text-anchor': 'end', 'font-size': 9, fill: '#64748b' }, String(Math.round(max * g / 4))));
    }
    var bw = (W - L - R) / rows.length;
    rows.forEach(function (r, i) {
      var x0 = L + i * bw, w = Math.min(14, bw / 3);
      [[r.pm, C.blue], [r.cm, C.orange]].forEach(function (p, j) {
        var hh = (H - T - B) * p[0] / max, x = x0 + bw / 2 - w - 1 + j * (w + 2);
        if (p[0] > 0) {
          svg.appendChild(sv('rect', { x: x, y: H - B - hh, width: w, height: hh, rx: 2, fill: p[1] }));
          svg.appendChild(sv('text', { x: x + w / 2, y: H - B - hh - 3, 'text-anchor': 'middle', 'font-size': 9, fill: '#334155' }, String(p[0])));
        }
      });
      svg.appendChild(sv('text', { x: x0 + bw / 2, y: H - 7, 'text-anchor': 'middle', 'font-size': 9, fill: '#64748b' }, r.month.slice(2).replace('-', '/')));
    });
    return svg;
  }

  function card(title, body) { return h('section', { class: 'card' }, h('div', { class: 'card-h' }, h('h2', null, title)), h('div', { class: 'card-b' }, body)); }
  function waiting(n) { return E.empty(t('d.c_waiting', { n: n })); }

  function render(el, opts, tok) {
    el.appendChild(E.pageHead(t('dash.title'), null, []));
    var holder = h('div', null, h('div', { class: 'empty' }, t('c.loading')));
    el.appendChild(holder);
    function load() {
      E.api('dashboard.summary').then(function (d) {
        if (!E.isCurrent(tok)) return;
        E.clear(holder);
        holder.appendChild(view(d));
        var head = el.querySelector('.page-head');
        var old = head.querySelector('.row-gap'); if (old) old.remove();
        head.appendChild(h('div', { class: 'row-gap' }, h('span', { class: 'small muted' }, t('dash.updated', { t: E.fmtDT(d.generatedAt) })),
          E.btn(t('c.refresh'), { icon: 'refresh', cls: 'sm', onclick: load })));
      }, function (e) { if (E.isCurrent(tok)) { E.clear(holder); holder.appendChild(h('div', { class: 'notice bad' }, E.errText(e))); } });
    }
    load();
  }

  function view(d) {
    var m = d.modules, tt = d.totals;
    var pct = function (n) { return tt.equipment ? Math.round(n / tt.equipment * 100) : 0; };
    var cards = [
      { k: 'd.total', v: tt.equipment, tone: 'info', sub: t('d.sub_all'), live: true, to: '' },
      { k: 'd.normal', v: tt.normal, tone: 'ok', sub: t('d.sub_pct', { n: pct(tt.normal) }), live: true, to: 'Normal' },
      { k: 'd.warning', v: tt.warning, tone: 'warn', sub: t('d.sub_pct', { n: pct(tt.warning) }), live: true, to: 'Warning' },
      { k: 'd.breakdown', v: tt.breakdown, tone: 'bad', sub: t('d.sub_pct', { n: pct(tt.breakdown) }), live: true, to: 'Breakdown' },
      { k: 'd.insp_today', v: d.inspections.today, tone: 'info', live: m.inspection, phase: 2 },
      { k: 'd.insp_notdone', v: d.inspections.notDone, tone: 'warn', live: m.inspection, phase: 2 },
      { k: 'd.pm_sched', v: d.pm.upcoming + d.pm.dueToday, tone: 'info', sub: t('d.sub_pm', { n: d.pm.dueToday }), live: m.pm, phase: 3 },
      { k: 'd.pm_overdue', v: d.pm.overdue, tone: 'bad', live: m.pm, phase: 3 },
      { k: 'd.cm_active', v: d.cm.active, tone: 'warn', live: m.cm, phase: 4 },
      { k: 'd.wo_open', v: d.wo.open, tone: 'info', live: m.wo, phase: 4 },
      { k: 'd.safety_open', v: d.safety.open, tone: 'bad', live: m.safety, phase: 5 }
    ];
    var stats = h('div', { class: 'grid stats' }, cards.map(function (c) {
      var clickable = c.live && c.to !== undefined;
      var el = h(clickable ? 'button' : 'div', { class: 'stat' + (c.live ? '' : ' off') + (clickable ? ' click' : ''), 'data-t': c.tone, type: clickable ? 'button' : null,
        onclick: clickable ? function () { E.go('equipment', { status: c.to }); } : null },
        h('span', { class: 'k' }, t(c.k)), h('span', { class: 'v' }, c.live ? String(c.v) : '—'),
        h('span', { class: 's' }, c.live ? (c.sub || '') : t('d.sub_phase', { n: c.phase })));
      return el;
    }));

    var statusParts = [
      { label: t('st.Normal'), value: tt.normal, color: C.ok }, { label: t('st.Warning'), value: tt.warning, color: C.warn },
      { label: t('st.Breakdown'), value: tt.breakdown, color: C.bad }];
    var condParts = ['Good', 'Fair', 'Poor', 'Critical'].map(function (k) {
      return { label: t('cond.' + k), value: d.conditions[k] || 0, color: { Good: C.ok, Fair: C.blue, Poor: C.warn, Critical: C.bad }[k] };
    });
    var maxCond = Math.max.apply(null, condParts.map(function (p) { return p.value; }).concat([1]));

    var cStatus = card(t('d.c_status'), h('div', { class: 'chart-wrap' },
      donut(statusParts, tt.equipment, t('d.c_status') + ': ' + statusParts.map(function (p) { return p.label + ' ' + p.value; }).join(', ')),
      h('div', { style: 'flex:1;min-width:120px' }, legend(statusParts.map(function (p) { return { label: p.label, value: p.value, color: p.color }; })))));
    var cCond = card(t('d.c_cond'), h('div', { class: 'bars-h' }, condParts.map(function (p) {
      return h('div', { class: 'row' }, h('span', { class: 'nm' }, p.label),
        h('div', { class: 'track', role: 'presentation' }, h('div', { class: 'fill', style: 'width:' + (p.value / maxCond * 100) + '%;background:' + p.color })), h('b', { class: 'right' }, String(p.value)));
    })));
    var monthlyLive = m.pm || m.cm;
    var cMonth = card(t('d.c_monthly'), monthlyLive ? h('div', null, monthlyChart(d.monthly),
      legend([{ label: t('d.pm'), color: C.blue }, { label: t('d.cm'), color: C.orange }])) : waiting(3));
    var maxW = Math.max.apply(null, d.workload.map(function (w) { return w.open; }).concat([1]));
    var cWork = card(t('d.c_workload'), !m.wo ? waiting(4) : (d.workload.length ? h('div', { class: 'bars-h' }, d.workload.map(function (w) {
      return h('div', { class: 'row' }, h('span', { class: 'nm', title: w.name }, w.name), h('div', { class: 'track' }, h('div', { class: 'fill', style: 'width:' + (w.open / maxW * 100) + '%' })), h('b', { class: 'right' }, String(w.open)));
    })) : E.empty(t('c.none'))));

    var charts = h('div', { class: 'grid cols-3', style: 'margin-bottom:14px' }, cStatus, cCond, cMonth);

    var recent = d.recent.length ? E.table([
      { label: t('col.time'), render: function (r) { return E.fmtDT(r.at); }, cls: 'nowrap' },
      { label: t('col.user'), render: function (r) { return r.user_email; } },
      { label: t('col.action'), render: function (r) { return actionLabel(r.action); } },
      { label: t('col.object'), render: function (r) { return r.entity_id ? h('span', { class: 'mono small' }, r.entity_id) : ''; } }
    ], d.recent) : E.empty(t('d.recent_none'));
    var cRecent = h('section', { class: 'card' }, h('div', { class: 'card-h' }, h('h2', null, t('d.recent'))), h('div', { style: 'padding:8px 0 0' }, recent));

    return h('div', null, stats, charts, h('div', { class: 'grid cols-1-2' }, cWork, cRecent));
  }

  E.pages.dashboard = { render: render };
})();
</script>
