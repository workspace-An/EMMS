<script>
/* Admin.html - halaman Users dan Settings (Umum, Data master, Audit log, Sistem). */
(function () {
  'use strict';
  var E = window.EMMS, h = E.h, t = E.t;
  var ROLES = ['Admin', 'Maintenance Manager', 'Supervisor', 'Technician', 'Viewer'];

  function roleOptions() { return ROLES.map(function (r) { return [r, t('role.' + r)]; }); }
  function langOptions() { return ['id', 'en', 'zh'].map(function (l) { return [l, t('lang.' + l)]; }); }

  // ================================================================== USERS
  function renderUsers(el, opts, tok) {
    var write = E.can('users.write');
    el.appendChild(E.pageHead(t('users.title'), t('users.sub'), write ? [E.btn(t('users.add'), { icon: 'plus', cls: 'primary', onclick: function () { openUser(null, load); } })] : []));
    if (!write) el.appendChild(h('div', { class: 'notice', style: 'margin-bottom:12px' }, t('users.readonly')));
    var host = h('div', { class: 'card' }, E.empty(t('c.loading')));
    el.appendChild(host);

    function load() {
      return E.api('users.list').then(function (rows) {
        if (!E.isCurrent(tok)) return;
        E.clear(host);
        var cols = [
          { label: t('f.full_name'), render: function (u) { return h('span', null, u.full_name, h('span', { class: 'sub' }, u.department)); } },
          { label: t('col.email'), render: function (u) { return u.email; } },
          { label: t('col.role'), render: function (u) { return E.badge('info', t('role.' + u.role)); } },
          { label: t('col.status'), render: function (u) { return E.activeBadge(u.status); } },
          { label: t('col.last_login'), render: function (u) { return u.last_login_at ? E.fmtDT(u.last_login_at) : h('span', { class: 'muted' }, t('users.never')); }, cls: 'nowrap' }
        ];
        if (write) cols.push({ label: '', cls: 'right', render: function (u) {
          var me = u.user_id === E.S.me.user_id;
          return h('div', { class: 'acts' },
            E.btn(t('c.edit'), { icon: 'edit', cls: 'sm', onclick: function () { openUser(u, load); } }),
            me ? null : E.btn(u.status === 'Active' ? t('c.deactivate') : t('c.activate'), { cls: 'sm' + (u.status === 'Active' ? ' danger' : ''), onclick: function () { toggleUser(u, load); } }));
        } });
        host.appendChild(E.table(cols, rows));
      }, E.fail);
    }
    load();
  }

  function toggleUser(u, done) {
    var next = u.status === 'Active' ? 'Inactive' : 'Active';
    E.api('users.setStatus', { user_id: u.user_id, status: next }).then(function () { E.toast(t('users.status_ok'), 'ok'); done(); }, E.fail);
  }

  function openUser(u, done) {
    var form = E.buildForm([
      { k: 'full_name', req: true, max: 80, span: 2 },
      { k: 'email', req: true, max: 120, type: 'email', inputmode: 'email', span: 2, hint: t('users.hint_email') },
      { k: 'role', type: 'select', req: true, options: roleOptions() },
      { k: 'department', max: 60 }, { k: 'phone', max: 30, inputmode: 'tel' },
      { k: 'language', type: 'select', options: langOptions(), blank: '—' }
    ], u || { role: 'Technician' });
    var save = E.btn(t('c.save'), { cls: 'primary' });
    var modal = E.openModal({ title: u ? t('users.edit') : t('users.add'), body: form.el, footer: [E.btn(t('c.cancel'), { onclick: function () { modal.close(); } }), save] });
    save.addEventListener('click', function () {
      if (!form.validate()) return;
      var p = form.get(); if (u) p.user_id = u.user_id;
      save.disabled = true;
      E.api('users.save', p).then(function () { E.toast(t('users.saved'), 'ok'); modal.close(); done(); }, function (er) { save.disabled = false; if (!form.showServerError(er)) E.fail(er); });
    });
  }

  // ================================================================== SETTINGS
  var TAB = 'general';

  function renderSettings(el, opts, tok) {
    el.appendChild(E.pageHead(t('set.title')));
    var tabs = [['general', t('set.general'), E.can('settings.read')], ['master', t('set.master'), E.can('master.read')],
      ['audit', t('set.audit'), E.can('audit.read')], ['system', t('set.system'), E.can('system.admin')]].filter(function (x) { return x[2]; });
    if (!tabs.some(function (x) { return x[0] === TAB; })) TAB = tabs[0][0];
    var bar = h('div', { class: 'tabs', role: 'tablist' });
    var panel = h('div');
    el.appendChild(bar); el.appendChild(panel);
    function draw() {
      E.clear(bar);
      tabs.forEach(function (x) {
        bar.appendChild(h('button', { class: 'tab' + (TAB === x[0] ? ' on' : ''), type: 'button', role: 'tab', 'aria-selected': TAB === x[0] ? 'true' : 'false', onclick: function () { TAB = x[0]; draw(); } }, x[1]));
      });
      E.clear(panel);
      if (TAB === 'general') tabGeneral(panel, tok); else if (TAB === 'master') tabMaster(panel, tok);
      else if (TAB === 'audit') tabAudit(panel, tok); else tabSystem(panel, tok);
    }
    draw();
  }

  // ---------------------------------------------------------------- Umum
  function tabGeneral(panel, tok) {
    panel.appendChild(h('div', { class: 'empty' }, t('c.loading')));
    E.api('settings.get').then(function (r) {
      if (!E.isCurrent(tok)) return;
      E.clear(panel);
      var write = E.can('settings.write');
      var v = r.values;
      var form = E.buildForm([
        { k: 'company_name', req: true, max: 80, disabled: !write }, { k: 'default_language', type: 'select', options: langOptions(), blank: false, disabled: !write },
        { k: 'company_address', max: 200, span: 2, disabled: !write },
        { k: 'app_url', max: 300, type: 'url', span: 2, hint: t('set.url_help'), disabled: !write, ph: 'https://script.google.com/macros/s/…/exec' },
        { k: 'session_hours', type: 'number', min: 1, disabled: !write }, { k: 'remember_days', type: 'number', min: 1, disabled: !write },
        { k: 'otp_ttl_minutes', type: 'number', min: 3, disabled: !write }
      ], v);
      var eff = r.effectiveAppUrl || '';
      var effEl = h('div', { class: 'stack', style: 'gap:6px' },
        h('div', { class: 'small muted' }, t('set.url_eff')),
        h('div', { class: 'mono small', style: 'overflow-wrap:anywhere' }, eff || '—'),
        eff.indexOf('/exec') < 0 ? h('div', { class: 'notice warn' }, t('set.url_bad')) : null);
      var save = E.btn(t('c.save'), { cls: 'primary' });
      var card = h('div', { class: 'card' }, h('div', { class: 'card-b stack' }, form.el, effEl, write ? h('div', { class: 'row-gap' }, save) : null));
      panel.appendChild(card);
      save.addEventListener('click', function () {
        var p = form.get();
        if (!form.validate()) return;
        save.disabled = true;
        E.api('settings.save', { values: p }).then(function (res) {
          save.disabled = false; E.toast(t('set.saved'), 'ok');
          if (E.S.me) { E.S.company = p.company_name; }
          E.clear(panel); tabGeneral(panel, tok);
          void res;
        }, function (er) { save.disabled = false; if (!form.showServerError(er)) E.fail(er); });
      });
    }, E.fail);
  }

  // ---------------------------------------------------------------- Data master
  function tabMaster(panel, tok) {
    var write = E.can('master.write');
    function redraw() { E.loadMaster(true).then(function () { if (E.isCurrent(tok)) { E.clear(panel); drawMaster(); } }, E.fail); }
    function drawMaster() {
      var m = E.S.master;
      panel.appendChild(h('div', { class: 'notice', style: 'margin-bottom:12px' }, t('m.note')));
      function section(title, addLabel, onAdd, cols, rows, entity, idKey, onEdit) {
        var allCols = cols.slice();
        allCols.push({ label: t('col.status'), render: function (r) { return E.activeBadge(r.status); } });
        if (write) allCols.push({ label: '', cls: 'right', render: function (r) {
          return h('div', { class: 'acts' }, E.btn(t('c.edit'), { icon: 'edit', cls: 'sm', onclick: function () { onEdit(r); } }),
            E.btn(r.status === 'Active' ? t('c.deactivate') : t('c.activate'), { cls: 'sm', onclick: function () {
              E.api('master.setStatus', { entity: entity, id: r[idKey], status: r.status === 'Active' ? 'Inactive' : 'Active' }).then(redraw, E.fail);
            } }));
        } });
        panel.appendChild(h('section', { class: 'card', style: 'margin-bottom:14px' },
          h('div', { class: 'card-h' }, h('h2', null, title), write ? E.btn(addLabel, { icon: 'plus', cls: 'sm primary', onclick: onAdd }) : null),
          h('div', { style: 'padding-top:8px' }, rows.length ? E.table(allCols, rows) : E.empty(t('c.none')))));
      }
      section(t('m.categories'), t('m.add_category'), function () { openMaster('category', null, redraw); },
        [{ label: t('col.code'), render: function (c) { return h('span', { class: 'mono' }, c.code); } },
         { label: t('col.name_en'), render: function (c) { return c.name_en; } }, { label: t('col.name_id'), render: function (c) { return c.name_id; } },
         { label: t('col.name_zh'), render: function (c) { return c.name_zh; } }], m.categories, 'category', 'category_id', function (r) { openMaster('category', r, redraw); });
      section(t('m.buildings'), t('m.add_building'), function () { openMaster('building', null, redraw); },
        [{ label: t('col.building'), render: function (b) { return b.building_name; } }, { label: t('f.description'), render: function (b) { return b.description; } }],
        m.buildings, 'building', 'building_id', function (r) { openMaster('building', r, redraw); });
      section(t('m.locations'), t('m.add_location'), function () {
        if (!m.buildings.some(function (b) { return b.status === 'Active'; })) return E.toast(t('m.no_building'), 'bad');
        openMaster('location', null, redraw);
      }, [{ label: t('col.location'), render: function (l) { return l.location_name; } },
          { label: t('col.building'), render: function (l) { var b = E.bldById(l.building_id); return b ? b.building_name : ''; } },
          { label: t('col.area'), render: function (l) { return l.production_area; } }],
        m.locations, 'location', 'location_id', function (r) { openMaster('location', r, redraw); });
    }
    E.loadMaster(true).then(function () { if (E.isCurrent(tok)) drawMaster(); }, E.fail);
  }

  function openMaster(entity, rec, done) {
    var m = E.S.master, defs;
    if (entity === 'category') defs = [{ k: 'code', req: true, max: 10, autocap: true }, { k: 'description', max: 200 },
      { k: 'name_en', req: true, max: 80 }, { k: 'name_id', req: true, max: 80 }, { k: 'name_zh', req: true, max: 80, span: 2 }];
    else if (entity === 'building') defs = [{ k: 'building_name', req: true, max: 80, span: 2 }, { k: 'description', max: 200, span: 2 }];
    else defs = [{ k: 'building_id', type: 'select', req: true, options: m.buildings.filter(function (b) { return b.status === 'Active' || (rec && b.building_id === rec.building_id); }).map(function (b) { return [b.building_id, b.building_name]; }) },
      { k: 'location_name', req: true, max: 80 }, { k: 'production_area', max: 80 }, { k: 'description', max: 200 }];
    var form = E.buildForm(defs, rec || {});
    var save = E.btn(t('c.save'), { cls: 'primary' });
    var modal = E.openModal({ title: t('m.' + (rec ? 'edit_' : 'add_') + entity), body: form.el, footer: [E.btn(t('c.cancel'), { onclick: function () { modal.close(); } }), save] });
    save.addEventListener('click', function () {
      if (!form.validate()) return;
      var r = form.get();
      var pkKey = { category: 'category_id', building: 'building_id', location: 'location_id' }[entity];
      if (rec) r[pkKey] = rec[pkKey];
      save.disabled = true;
      E.api('master.save', { entity: entity, record: r }).then(function () { E.toast(t('c.saved'), 'ok'); modal.close(); done(); },
        function (er) { save.disabled = false; if (!form.showServerError(er)) E.fail(er); });
    });
  }

  // ---------------------------------------------------------------- Audit
  function tabAudit(panel, tok) {
    panel.appendChild(h('div', { class: 'empty' }, t('c.loading')));
    E.api('audit.recent', { limit: 100 }).then(function (rows) {
      if (!E.isCurrent(tok)) return;
      E.clear(panel);
      panel.appendChild(h('div', { class: 'card' }, rows.length ? E.table([
        { label: t('col.time'), render: function (r) { return E.fmtDT(r.at); }, cls: 'nowrap' },
        { label: t('col.user'), render: function (r) { return h('span', null, r.user_email, r.user_role ? h('span', { class: 'sub' }, r.user_role) : null); } },
        { label: t('col.action'), render: function (r) { return E.actionLabel(r.action); } },
        { label: t('col.object'), render: function (r) { return r.entity_id ? h('span', { class: 'mono small' }, r.entity_id) : (r.entity_type || ''); } }
      ], rows) : E.empty(t('d.recent_none'))));
    }, E.fail);
  }

  // ---------------------------------------------------------------- Sistem
  function tabSystem(panel, tok) {
    var out = h('div');
    var run = E.btn(t('sys.run'), { icon: 'refresh', onclick: diag });
    function yn(b) { return b ? E.badge('ok', t('sys.yes')) : E.badge('warn', t('sys.no')); }
    function diag() {
      run.disabled = true;
      E.api('system.diagnostics').then(function (d) {
        run.disabled = false; if (!E.isCurrent(tok)) return;
        E.clear(out);
        var rows = [
          [t('sys.version'), d.version], [t('sys.tz'), d.timezone], [t('sys.auth'), t('sys.auth_v')],
          [t('sys.active_email'), yn(d.activeUserEmailAvailable)], [t('sys.mail'), String(d.mailQuotaRemaining)],
          [t('sys.sheets'), d.sheetsOk + ' / 25'], [t('sys.missing'), d.sheetsMissing.length ? d.sheetsMissing.join(', ') : '—'],
          [t('set.url_eff'), d.appUrl || '—'], [t('sys.db'), h('a', { href: d.spreadsheetUrl, target: '_blank', rel: 'noopener' }, d.spreadsheetUrl)]];
        var dl = h('dl', { class: 'kv' });
        rows.forEach(function (r) { dl.appendChild(h('dt', null, r[0])); dl.appendChild(h('dd', null, r[1])); });
        out.appendChild(dl);
        if (!d.appUrlLooksLikeExec) out.appendChild(h('div', { class: 'notice warn', style: 'margin-top:10px' }, t('set.url_bad')));
      }, function (er) { run.disabled = false; E.fail(er); });
    }
    var logoutAll = E.btn(t('sys.logout_all'), { cls: 'danger', onclick: function () {
      E.confirmBox({ title: t('sys.logout_all'), message: t('sys.logout_all_c'), okLabel: t('sys.logout_all'), danger: true }).then(function (ok) {
        if (ok) E.api('auth.logoutAll').then(function () { /* sesi sendiri berakhir pada panggilan berikutnya */ E.toast(t('c.saved'), 'ok'); setTimeout(function () { location.reload(); }, 600); }, E.fail);
      });
    } });
    var sync = E.btn(t('sys.refresh_qr'), { onclick: function () {
      E.api('system.refreshQr').then(function (r) { E.toast(t('sys.qr_done', { n: r.updated }), 'ok'); }, E.fail);
    } });
    panel.appendChild(h('div', { class: 'grid cols-2' },
      h('section', { class: 'card' }, h('div', { class: 'card-b stack' }, run, out)),
      h('section', { class: 'card' }, h('div', { class: 'card-b stack' },
        h('div', null, h('h3', null, t('sys.logout_all')), h('p', { class: 'muted', style: 'margin:4px 0 8px' }, t('sys.logout_all_b')), logoutAll),
        h('div', null, h('h3', null, t('sys.refresh_qr')), h('p', { class: 'muted', style: 'margin:4px 0 8px' }, t('sys.refresh_qr_d')), sync)))));
    diag();
  }

  E.pages.users = { render: renderUsers };
  E.pages.settings = { render: renderSettings };
})();
</script>
