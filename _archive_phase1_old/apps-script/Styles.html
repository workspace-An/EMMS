<style>
:root {
  --navy: #0b1f3a; --navy-2: #13315c; --navy-3: #1c4170;
  --blue: #2563eb; --blue-d: #1d4ed8; --blue-l: #dbeafe;
  --bg: #f1f5f9; --card: #ffffff; --line: #e2e8f0; --line-2: #cbd5e1;
  --text: #0f172a; --text-2: #334155; --muted: #64748b;
  --ok: #15803d; --ok-bg: #dcfce7; --warn: #b45309; --warn-bg: #fef3c7;
  --bad: #b91c1c; --bad-bg: #fee2e2; --info: #1d4ed8; --info-bg: #dbeafe;
  --radius: 10px; --shadow: 0 1px 2px rgba(15,23,42,.06), 0 1px 3px rgba(15,23,42,.08);
  --sidebar: 248px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { font-family: var(--font); font-size: 14px; line-height: 1.45; color: var(--text); background: var(--bg); -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; font-weight: 650; }
h1 { font-size: 20px; } h2 { font-size: 16px; } h3 { font-size: 14px; }
a { color: var(--blue); }
.muted { color: var(--muted); } .small { font-size: 12px; } .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.nowrap { white-space: nowrap; } .right { text-align: right; } .hidden { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

#busy { position: fixed; top: 0; left: 0; height: 3px; width: 0; background: var(--blue); z-index: 9999; transition: width .3s ease, opacity .3s; opacity: 0; }
#busy.on { opacity: 1; width: 70%; }

/* ---------- Buttons & fields ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 38px; padding: 0 14px; border: 1px solid var(--line-2); background: #fff; border-radius: 8px; cursor: pointer; font-weight: 550; color: var(--text-2); transition: background .12s, border-color .12s; text-decoration: none; }
.btn:hover:not(:disabled) { background: #f8fafc; border-color: #94a3b8; }
.btn:focus-visible, .nav a:focus-visible, .tab:focus-visible, .chip:focus-visible { outline: 3px solid var(--blue-l); outline-offset: 1px; border-color: var(--blue); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn.primary:hover:not(:disabled) { background: var(--blue-d); border-color: var(--blue-d); }
.btn.danger { background: #fff; border-color: #fca5a5; color: var(--bad); }
.btn.danger:hover:not(:disabled) { background: var(--bad-bg); border-color: var(--bad); }
.btn.danger.solid { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn.danger.solid:hover:not(:disabled) { background: #991b1b; }
.btn.sm { min-height: 32px; padding: 0 10px; font-size: 13px; }
.btn.block { width: 100%; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover:not(:disabled) { background: #e2e8f0; border-color: transparent; }

.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: 12px; font-weight: 600; color: var(--text-2); }
.field .req { color: var(--bad); }
input[type=text], input[type=email], input[type=date], input[type=search], input[type=number], input[type=url], select, textarea {
  width: 100%; min-height: 38px; padding: 7px 10px; border: 1px solid var(--line-2); border-radius: 8px; background: #fff; font-size: 14px;
}
textarea { resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 3px solid var(--blue-l); border-color: var(--blue); }
input:disabled, select:disabled, textarea:disabled { background: #f1f5f9; color: var(--muted); }
.field.bad input, .field.bad select, .field.bad textarea { border-color: var(--bad); }
.err { color: var(--bad); font-size: 12px; min-height: 0; }
.err:empty { display: none; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
.form-grid .span2 { grid-column: 1 / -1; }
.check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); cursor: pointer; }
.check input { width: 18px; height: 18px; }

/* ---------- Badges ---------- */
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; background: #e2e8f0; color: var(--text-2); }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge.ok { background: var(--ok-bg); color: var(--ok); } .badge.warn { background: var(--warn-bg); color: var(--warn); }
.badge.bad { background: var(--bad-bg); color: var(--bad); } .badge.info { background: var(--info-bg); color: var(--info); }
.badge.off { background: #e2e8f0; color: #475569; }
.tag { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; background: rgba(255,255,255,.14); color: #cbd5e1; }

/* ---------- Shell ---------- */
.shell { min-height: 100vh; display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); }
.sidebar { background: var(--navy); color: #cbd5e1; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto; z-index: 40; }
.brand { padding: 18px 18px 14px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid rgba(255,255,255,.08); }
.brand .logo { width: 34px; height: 34px; border-radius: 9px; background: var(--blue); display: grid; place-items: center; color: #fff; }
.brand .logo svg { width: 20px; height: 20px; }
.brand b { color: #fff; font-size: 16px; letter-spacing: .02em; display: block; }
.brand span { font-size: 11px; color: #94a3b8; display: block; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav { padding: 10px 10px 16px; display: flex; flex-direction: column; gap: 2px; flex: 1; }
.nav .grp { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: #64748b; padding: 12px 10px 4px; }
.nav a { display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 8px; color: #cbd5e1; text-decoration: none; cursor: pointer; font-weight: 500; }
.nav a:hover { background: rgba(255,255,255,.07); color: #fff; }
.nav a.active { background: var(--blue); color: #fff; }
.nav a .tag { margin-left: auto; }
.side-foot { padding: 12px 18px; font-size: 11px; color: #64748b; border-top: 1px solid rgba(255,255,255,.08); }
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 30; background: rgba(255,255,255,.92); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; padding: 10px 20px; min-height: 56px; }
.topbar h1 { font-size: 17px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar .burger { display: none; }
.lang { width: auto; min-width: 0; min-height: 34px; padding: 4px 8px; font-size: 13px; }
.user-chip { display: flex; align-items: center; gap: 9px; padding: 3px 4px 3px 10px; border: 1px solid var(--line); border-radius: 999px; background: #fff; }
.user-chip .who { line-height: 1.15; text-align: right; }
.user-chip .who b { display: block; font-size: 13px; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.user-chip .who span { font-size: 11px; color: var(--muted); }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--navy-2); color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.content { padding: 20px; max-width: 1400px; width: 100%; margin: 0 auto; }
.backdrop { display: none; }

/* ---------- Cards, page head ---------- */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.page-head p { margin: 2px 0 0; color: var(--muted); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.card > .card-h { padding: 14px 16px 0; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.card > .card-b { padding: 14px 16px 16px; }
.grid { display: grid; gap: 14px; }
.stats { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-bottom: 14px; }
.stat { padding: 14px 16px; display: flex; flex-direction: column; gap: 3px; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; box-shadow: var(--shadow); text-align: left; cursor: default; position: relative; overflow: hidden; }
.stat::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--c, var(--navy-3)); }
.stat.click { cursor: pointer; } .stat.click:hover { border-color: var(--line-2); transform: translateY(-1px); }
.stat .k { font-size: 12px; font-weight: 600; color: var(--muted); }
.stat .v { font-size: 28px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat .s { font-size: 11px; color: var(--muted); min-height: 15px; }
.stat.off .v { color: #94a3b8; }
.stat[data-t=ok] { --c: #16a34a; } .stat[data-t=warn] { --c: #d97706; } .stat[data-t=bad] { --c: #dc2626; } .stat[data-t=info] { --c: var(--blue); }
.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.cols-1-2 { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); align-items: start; }
.empty { text-align: center; color: var(--muted); padding: 26px 12px; }
.empty b { display: block; color: var(--text-2); margin-bottom: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 12px; color: var(--text-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.chart-wrap { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
svg.chart { width: 100%; height: auto; display: block; }
.donut { width: 150px; height: 150px; flex: none; }
.bars-h { display: flex; flex-direction: column; gap: 9px; }
.bars-h .row { display: grid; grid-template-columns: 110px minmax(0, 1fr) 32px; align-items: center; gap: 8px; font-size: 12px; }
.bars-h .track { height: 10px; background: #e2e8f0; border-radius: 6px; overflow: hidden; }
.bars-h .fill { height: 100%; background: var(--blue); border-radius: 6px; }
.bars-h .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- Toolbar & tables ---------- */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.toolbar .grow { flex: 1 1 220px; min-width: 160px; position: relative; }
.toolbar .grow svg { position: absolute; left: 10px; top: 10px; color: var(--muted); }
.toolbar .grow input { padding-left: 34px; }
.toolbar select { width: auto; min-width: 130px; flex: 0 1 auto; }
.tbl-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; }
.tbl th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 650; padding: 10px 14px; background: #f8fafc; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl tbody tr.click { cursor: pointer; } .tbl tbody tr.click:hover { background: #f8fafc; }
.tbl tbody tr.deleted td { opacity: .55; text-decoration: line-through; }
.tbl .sub { display: block; font-size: 12px; color: var(--muted); }
.tbl .acts { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }

/* ---------- Tabs ---------- */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 14px; overflow-x: auto; }
.tab { border: 0; background: none; padding: 10px 14px; cursor: pointer; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; margin-bottom: -1px; }
.tab:hover { color: var(--text); } .tab.on { color: var(--blue); border-bottom-color: var(--blue); }

/* ---------- Modal ---------- */
.overlay { position: fixed; inset: 0; background: rgba(15,23,42,.55); z-index: 100; display: flex; align-items: flex-start; justify-content: center; padding: 4vh 12px; overflow-y: auto; }
.modal { background: #fff; border-radius: 14px; width: 100%; max-width: 560px; box-shadow: 0 20px 50px rgba(0,0,0,.3); display: flex; flex-direction: column; }
.modal.wide { max-width: 860px; }
.modal-h { padding: 16px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.modal-h h2 { flex: 1; min-width: 0; font-size: 16px; }
.modal-b { padding: 16px 18px; }
.modal-f { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; background: #f8fafc; border-radius: 0 0 14px 14px; }
.x { border: 0; background: none; cursor: pointer; padding: 6px; border-radius: 6px; color: var(--muted); display: grid; } .x:hover { background: #e2e8f0; }

/* ---------- Detail ---------- */
.detail-top { display: flex; gap: 16px; align-items: flex-start; margin-bottom: 14px; flex-wrap: wrap; }
.photo { width: 168px; height: 126px; border-radius: 10px; background: #f1f5f9; border: 1px dashed var(--line-2); display: grid; place-items: center; overflow: hidden; flex: none; position: relative; color: var(--muted); font-size: 12px; text-align: center; }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.dl { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 18px; margin: 0; }
.dl div { min-width: 0; } .dl dt { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 650; }
.dl dd { margin: 1px 0 0; overflow-wrap: anywhere; } .dl .span2 { grid-column: 1 / -1; }
.qr-box { display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-start; }
.qr-box .qr { width: 200px; max-width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 8px; background: #fff; }
.qr-box .qr svg { width: 100%; height: auto; display: block; }
.notice { padding: 10px 12px; border-radius: 8px; font-size: 13px; background: var(--info-bg); color: #1e3a8a; border: 1px solid #bfdbfe; }
.notice.warn { background: var(--warn-bg); color: #78350f; border-color: #fcd34d; }
.notice.bad { background: var(--bad-bg); color: #7f1d1d; border-color: #fca5a5; }
.notice.ok { background: var(--ok-bg); color: #14532d; border-color: #86efac; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row-gap { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.kv { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 6px 14px; font-size: 13px; } .kv dt { color: var(--muted); } .kv dd { margin: 0; overflow-wrap: anywhere; }

/* ---------- Toasts ---------- */
#toasts { position: fixed; right: 16px; bottom: 16px; z-index: 300; display: flex; flex-direction: column; gap: 8px; max-width: min(380px, calc(100vw - 32px)); }
.toast { background: var(--navy); color: #fff; padding: 11px 14px; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.25); font-size: 13px; border-left: 4px solid var(--blue); animation: tin .2s ease; }
.toast.ok { border-left-color: #22c55e; } .toast.bad { border-left-color: #ef4444; background: #3b0d0d; }
@keyframes tin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- Login ---------- */
.login { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.login-art { background: linear-gradient(155deg, var(--navy) 0%, var(--navy-3) 100%); color: #e2e8f0; padding: 48px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }
.login-art::after { content: ""; position: absolute; right: -90px; bottom: -90px; width: 360px; height: 360px; border-radius: 50%; border: 60px solid rgba(255,255,255,.05); }
.login-art h2 { font-size: 30px; line-height: 1.2; color: #fff; max-width: 420px; }
.login-art p { max-width: 420px; color: #94a3b8; }
.login-art .brand { border: 0; padding: 0; }
.login-art ul { list-style: none; padding: 0; margin: 20px 0 0; display: grid; gap: 8px; color: #cbd5e1; }
.login-art li::before { content: "\2713"; color: #60a5fa; margin-right: 8px; font-weight: 700; }
.login-form { display: flex; align-items: center; justify-content: center; padding: 28px 20px; background: #fff; }
.login-box { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 14px; }
.login-box h1 { font-size: 24px; }
.code-in { text-align: center; font-size: 26px !important; letter-spacing: .5em; font-weight: 700; font-variant-numeric: tabular-nums; padding-left: .5em !important; }
.login-lang { position: absolute; top: 16px; right: 16px; }

/* ---------- Print: label QR ---------- */
#print-area { display: none; }
.labels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6mm; }
.label { border: 1px solid #000; border-radius: 3mm; padding: 4mm; display: flex; gap: 4mm; align-items: center; break-inside: avoid; page-break-inside: avoid; color: #000; }
.label svg { width: 28mm; height: 28mm; flex: none; }
.label .lid { font: 700 13pt/1.1 ui-monospace, Menlo, Consolas, monospace; }
.label .lnm { font: 600 9pt/1.2 var(--font); margin-top: 1mm; }
.label .lloc { font: 8pt/1.2 var(--font); color: #333; margin-top: 1mm; }
@media print {
  body { background: #fff; }
  #app, #modal-root, #toasts, #busy { display: none !important; }
  #print-area { display: block !important; }
  @page { margin: 10mm; }
}

/* ---------- Responsive ---------- */
@media (max-width: 1100px) { .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); } .cols-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .cols-1-2 { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: min(280px, 84vw); transform: translateX(-102%); transition: transform .2s ease; box-shadow: 0 0 40px rgba(0,0,0,.4); }
  .shell.nav-open .sidebar { transform: none; }
  .shell.nav-open .backdrop { display: block; position: fixed; inset: 0; background: rgba(15,23,42,.5); z-index: 35; }
  .topbar { padding: 8px 12px; } .topbar .burger { display: inline-flex; }
  .user-chip .who { display: none; } .user-chip { padding: 3px; }
  .content { padding: 14px 12px 28px; }
  .cols-2, .cols-3, .cols-1-2 { grid-template-columns: minmax(0, 1fr); }
  .login { grid-template-columns: minmax(0, 1fr); } .login-art { display: none; }
  .login-form { align-items: flex-start; padding-top: 72px; min-height: 100vh; }
}
@media (max-width: 720px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .stat { padding: 12px 12px 12px 14px; } .stat .v { font-size: 24px; }
  .form-grid, .dl { grid-template-columns: minmax(0, 1fr); }
  .kv { grid-template-columns: minmax(0, 1fr); gap: 0; } .kv dd { margin-bottom: 8px; }
  .toolbar select { flex: 1 1 45%; min-width: 0; }
  .overlay { padding: 0; align-items: stretch; } .modal, .modal.wide { max-width: none; min-height: 100vh; border-radius: 0; }
  .modal-f { border-radius: 0; position: sticky; bottom: 0; }
  .modal-f .btn { flex: 1 1 auto; }
  /* tabel menjadi kartu */
  table.tbl.cards thead { display: none; }
  table.tbl.cards, table.tbl.cards tbody, table.tbl.cards tr, table.tbl.cards td { display: block; width: 100%; }
  table.tbl.cards tr { padding: 10px 14px; border-bottom: 1px solid var(--line); }
  table.tbl.cards tbody tr:last-child { border-bottom: 0; }
  table.tbl.cards td { border: 0; padding: 2px 0; display: flex; justify-content: space-between; gap: 12px; text-align: right; }
  table.tbl.cards td::before { content: attr(data-label); color: var(--muted); font-size: 12px; text-align: left; flex: none; }
  table.tbl.cards td[data-label=""]::before { content: none; }
  table.tbl.cards td.first { font-weight: 650; justify-content: flex-start; text-align: left; }
  table.tbl.cards td.first::before { content: none; }
  .labels { grid-template-columns: repeat(2, 1fr); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
