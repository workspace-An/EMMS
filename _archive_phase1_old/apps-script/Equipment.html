<script>
/* Equipment.html - halaman Equipment: daftar + filter, detail (info/QR/riwayat), tambah/ubah, hapus aman, foto, label QR. */
(function () {
  'use strict';
  var E = window.EMMS, h = E.h, t = E.t;
  var F = { q: '', building: '', category: '', status: '', showDeleted: false };
  var ROWS = [];

  function catName(id) { return E.catLabel(E.catById(id)); }
  function locText(e) {
    var b = E.bldById(e.building_id), l = E.locById(e.location_id);
    return { b: b ? b.building_name : '', l: l ? l.location_name : '' };
  }

  function filtered() {
    var q = F.q.trim().toLowerCase();
    return ROWS.filter(function (e) {
      if (F.building && e.building_id !== F.building) return false;
      if (F.category && e.category_id !== F.category) return false;
      if (F.status && e.status !== F.status) return false;
      if (q) {
        var lt = locText(e);
        var hay = [e.equipment_id, e.equipment_name, e.brand, e.model, e.serial_number, e.production_area, lt.b, lt.l, catName(e.category_id)].join(' ').toLowerCase();
        if (hay.indexOf(q) < 0) return false;
      }
      return true;
    });
  }

  // ------------------------------------------------------------------ QR & label
  function qrUsable(url) { return /\/exec\?eq=/.test(url || ''); }
  function qrSvg(url) { var d = document.createElement('div'); d.innerHTML = EMMSQR.svg(url, { margin: 2 }); return d.firstChild; }

  function labelNode(e, url) {
    var lt = locText(e);
    return h('div', { class: 'label' }, qrSvg(url),
      h('div', null, h('div', { class: 'lid' }, e.equipment_id), h('div', { class: 'lnm' }, e.equipment_name),
        h('div', { class: 'lloc' }, [lt.b, lt.l].filter(Boolean).join(' / '))));
  }

  function downloadPng(e, url) {
    var c = document.createElement('canvas'); c.width = 760; c.height = 320;
    var x = c.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
    x.strokeStyle = '#000'; x.lineWidth = 3; x.strokeRect(6, 6, c.width - 12, c.height - 12);
    EMMSQR.drawCanvas(x, url, 24, 30, 260, 2);
    x.fillStyle = '#000'; x.textBaseline = 'top';
    x.font = '700 40px ui-monospace, Menlo, Consolas, monospace'; x.fillText(e.equipment_id, 310, 44);
    x.font = '600 26px sans-serif';
    wrap(x, e.equipment_name, 310, 106, 430, 32, 3);
    var lt = locText(e); x.font = '22px sans-serif'; x.fillStyle = '#333';
    x.fillText([lt.b, lt.l].filter(Boolean).join(' / ').slice(0, 40), 310, 240);
    c.toBlob(function (blob) {
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'QR-' + e.equipment_id + '.png';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    }, 'image/png');
  }
  function wrap(ctx, text, x, y, maxW, lh, maxLines) {
    var words = String(text).split(/\s+/), line = '', n = 0;
    for (var i = 0; i < words.length; i++) {
      var test = line ? line + ' ' + words[i] : words[i];
      if (ctx.measureText(test).width > maxW && line) { ctx.fillText(line, x, y); y += lh; line = words[i]; if (++n >= maxLines) return; }
      else line = test;
    }
    if (line) ctx.fillText(line, x, y);
  }

  function printAllLabels() {
    var list = filtered().filter(function (e) { return e.record_status !== 'Deleted'; });
    var base = E.S.appUrl || '';
    if (!list.length) return E.toast(t('eq.empty'), 'bad');
    if (base.indexOf('/exec') < 0) return E.toast(t('eq.qr_warn'), 'bad');
    var grid = h('div', { class: 'labels' }, list.map(function (e) { return labelNode(e, base + '?eq=' + encodeURIComponent(e.equipment_id)); }));
    E.printNode(grid);
  }

  // ------------------------------------------------------------------ Daftar
  function render(el, opts, tok) {
    var pending = E.S.pending; E.S.pending = null;
    if (pending && pending.status !== undefined) { F.status = pending.status; }
    var actions = [E.btn(t('eq.labels'), { icon: 'printer', onclick: printAllLabels })];
    if (E.can('equipment.create')) actions.push(E.btn(t('eq.add'), { icon: 'plus', cls: 'primary', onclick: function () { openForm(null, reload); } }));
    el.appendChild(E.pageHead(t('eq.title'), t('eq.sub'), actions));

    var q = h('input', { type: 'search', placeholder: t('eq.search'), 'aria-label': t('eq.search'), autocomplete: 'off' }); q.value = F.q;
    var m = E.S.master;
    var bSel = h('select', { 'aria-label': t('col.building') });
    E.setOptions(bSel, m.buildings.filter(function (b) { return b.status === 'Active'; }).map(function (b) { return [b.building_id, b.building_name]; }), F.building, t('eq.f_building'));
    var cSel = h('select', { 'aria-label': t('col.category') });
    E.setOptions(cSel, m.categories.filter(function (c) { return c.status === 'Active'; }).map(function (c) { return [c.category_id, E.catLabel(c)]; }), F.category, t('eq.f_category'));
    var sSel = h('select', { 'aria-label': t('col.status') });
    E.setOptions(sSel, ['Normal', 'Warning', 'Breakdown'].map(function (s) { return [s, t('st.' + s)]; }), F.status, t('eq.f_status'));
    var del = null;
    if (E.can('equipment.restore')) {
      var cb = h('input', { type: 'checkbox', id: 'eq_del' }); cb.checked = F.showDeleted;
      cb.addEventListener('change', function () { F.showDeleted = cb.checked; reload(); });
      del = h('label', { class: 'check', for: 'eq_del' }, cb, t('eq.show_deleted'));
    }
    el.appendChild(h('div', { class: 'toolbar' }, h('div', { class: 'grow' }, E.ic('search'), q), bSel, cSel, sSel, del));
    var count = h('div', { class: 'small muted', style: 'margin:-4px 2px 8px' });
    var host = h('div', { class: 'card' });
    el.appendChild(count); el.appendChild(host);

    function draw() {
      var rows = filtered();
      count.textContent = t('eq.count', { n: rows.length });
      E.clear(host);
      if (!rows.length) { host.appendChild(E.empty(t('eq.empty'), t('eq.empty_h'))); return; }
      host.appendChild(E.table([
        { label: t('col.id'), render: function (e) { return h('span', { class: 'mono' }, e.equipment_id); }, cls: 'nowrap' },
        { label: t('col.name'), render: function (e) { return h('span', null, e.equipment_name, h('span', { class: 'sub' }, [e.brand, e.model].filter(Boolean).join(' '))); } },
        { label: t('col.category'), render: function (e) { return catName(e.category_id); } },
        { label: t('col.location'), render: function (e) { var l = locText(e); return h('span', null, l.l, h('span', { class: 'sub' }, l.b)); } },
        { label: t('col.status'), render: function (e) { return e.record_status === 'Deleted' ? E.badge('off', t('eq.is_deleted')) : E.statusBadge(e.status); } },
        { label: t('col.condition'), render: function (e) { return E.condBadge(e.condition); } }
      ], rows, { onRow: function (e) { openDetail(e.equipment_id, false, reload); }, rowClass: function (e) { return e.record_status === 'Deleted' ? 'deleted' : ''; } }));
    }
    function reload() {
      return E.api('equipment.list', { includeDeleted: F.showDeleted }).then(function (rows) {
        if (!E.isCurrent(tok)) return;
        ROWS = rows; draw();
      }, E.fail);
    }
    var timer = null;
    q.addEventListener('input', function () { F.q = q.value; clearTimeout(timer); timer = setTimeout(draw, 120); });
    bSel.addEventListener('change', function () { F.building = bSel.value; draw(); });
    cSel.addEventListener('change', function () { F.category = cSel.value; draw(); });
    sSel.addEventListener('change', function () { F.status = sSel.value; draw(); });
    host.appendChild(E.empty(t('c.loading')));
    reload().then(function () {
      if (pending && pending.open && E.isCurrent(tok)) openDetail(pending.open, !!pending.scan, reload);
    });
  }

  // ------------------------------------------------------------------ Detail
  function field(label, value, span) { return h('div', { class: span ? 'span2' : '' }, h('dt', null, label), h('dd', null, value === '' || value == null ? '—' : value)); }

  function openDetail(id, scan, onChanged) {
    E.api('equipment.get', { equipment_id: id }).then(function (res) {
      var e = res.equipment, url = res.qrUrl, deleted = e.record_status === 'Deleted';
      var lt = locText(e);
      var tab = 'info';
      var panel = h('div');
      var tabsEl = h('div', { class: 'tabs', role: 'tablist' });
      var photoBox = h('div', { class: 'photo' }, t('eq.photo_none'));
      var modal;

      function loadPhoto() {
        E.api('equipment.photo', { equipment_id: id }).then(function (p) {
          if (p && p.dataUrl) { E.clear(photoBox); photoBox.appendChild(h('img', { src: p.dataUrl, alt: e.equipment_name })); }
        }, function () { /* foto opsional */ });
      }
      var photoBtn = null;
      if (E.can('equipment.update') && !deleted) {
        var file = h('input', { type: 'file', accept: 'image/*', class: 'hidden' });
        file.addEventListener('change', function () {
          if (!file.files || !file.files[0]) return;
          photoBtn.disabled = true;
          E.imageToJpeg(file.files[0], 1280, 0.82).then(function (data) {
            return E.api('equipment.uploadPhoto', { equipment_id: id, data: data });
          }).then(function () { E.toast(t('eq.photo_ok'), 'ok'); loadPhoto(); photoBtn.disabled = false; }, function (er) { photoBtn.disabled = false; E.fail(er); });
          file.value = '';
        });
        photoBtn = E.btn(t('eq.photo_add'), { icon: 'camera', cls: 'sm', onclick: function () { file.click(); } });
        photoBtn.appendChild(file);
      }

      var top = h('div', { class: 'detail-top' },
        h('div', { class: 'stack', style: 'gap:8px' }, photoBox, photoBtn),
        h('div', { class: 'stack', style: 'flex:1;min-width:220px;gap:8px' },
          h('div', { class: 'row-gap' }, deleted ? E.badge('off', t('eq.is_deleted')) : E.statusBadge(e.status), E.condBadge(e.condition)),
          h('div', null, h('div', { class: 'small muted' }, catName(e.category_id)), h('div', { style: 'font-size:16px;font-weight:650' }, e.equipment_name)),
          h('div', { class: 'small muted' }, [lt.b, lt.l, e.production_area].filter(Boolean).join(' · '))));

      function tabBtn(key, label) {
        var b = h('button', { class: 'tab' + (tab === key ? ' on' : ''), type: 'button', role: 'tab', 'aria-selected': tab === key ? 'true' : 'false', onclick: function () { tab = key; drawTabs(); } }, label);
        return b;
      }
      function drawTabs() {
        E.clear(tabsEl);
        tabsEl.appendChild(tabBtn('info', t('eq.tab_info'))); tabsEl.appendChild(tabBtn('qr', t('eq.tab_qr'))); tabsEl.appendChild(tabBtn('hist', t('eq.tab_hist')));
        E.clear(panel);
        if (tab === 'info') panel.appendChild(infoPanel()); else if (tab === 'qr') panel.appendChild(qrPanel()); else histPanel(panel);
      }
      function infoPanel() {
        return h('dl', { class: 'dl' },
          field(t('f.brand'), e.brand), field(t('f.model'), e.model), field(t('f.serial_number'), e.serial_number), field(t('f.power_rating'), e.power_rating),
          field(t('f.voltage'), e.voltage), field(t('f.current'), e.current), field(t('f.electrical_spec'), e.electrical_spec, true),
          field(t('f.installation_date'), e.installation_date), field(t('f.commissioning_date'), e.commissioning_date),
          field(t('f.notes'), e.notes, true),
          field(t('c.created_at'), E.fmtDT(e.created_at) + (e.created_by ? ' · ' + e.created_by : '')),
          field(t('c.updated_at'), E.fmtDT(e.updated_at) + (e.updated_by ? ' · ' + e.updated_by : '')));
      }
      function qrPanel() {
        var usable = qrUsable(url);
        var box = h('div', { class: 'qr-box' });
        if (usable) box.appendChild(h('div', { class: 'qr' }, qrSvg(url)));
        box.appendChild(h('div', { class: 'stack', style: 'flex:1;min-width:220px' },
          usable ? h('p', { class: 'muted', style: 'margin:0' }, t('eq.qr_help')) : h('div', { class: 'notice warn' }, t('eq.qr_warn')),
          h('div', null, h('div', { class: 'small muted' }, t('eq.qr_url')), h('div', { class: 'mono small', style: 'overflow-wrap:anywhere' }, url)),
          usable ? h('div', { class: 'row-gap' },
            E.btn(t('c.print'), { icon: 'printer', cls: 'sm', onclick: function () { E.printNode(h('div', { class: 'labels' }, labelNode(e, url))); } }),
            E.btn(t('eq.qr_png'), { icon: 'download', cls: 'sm', onclick: function () { downloadPng(e, url); } }),
            E.btn(t('c.copy'), { cls: 'sm', onclick: function () { E.copyText(url).then(function (ok) { if (ok) E.toast(t('c.copied'), 'ok'); }); } })) : null));
        return box;
      }
      function histPanel(into) {
        into.appendChild(h('div', { class: 'empty' }, t('c.loading')));
        E.api('equipment.history', { equipment_id: id }).then(function (hs) {
          E.clear(into);
          function sec(title, rows, cols, phase) {
            var body = rows.length ? E.table(cols, rows) : E.empty(t('eq.h_empty', { n: phase }));
            into.appendChild(h('div', { style: 'margin-bottom:14px' }, h('h3', { style: 'margin-bottom:6px' }, title), h('div', { class: 'card' }, body)));
          }
          sec(t('eq.h_insp'), hs.inspections, [
            { label: t('col.time'), render: function (r) { return r.inspection_date; } }, { label: t('col.user'), render: function (r) { return r.technician_name; } },
            { label: t('col.status'), render: function (r) { return r.inspection_result; } }], 2);
          sec(t('eq.h_pm'), hs.preventive, [
            { label: t('col.time'), render: function (r) { return r.planned_date; } }, { label: t('col.action'), render: function (r) { return r.result; } },
            { label: t('col.status'), render: function (r) { return r.status; } }], 3);
          sec(t('eq.h_cm'), hs.corrective, [
            { label: t('col.id'), render: function (r) { return r.complaint_number; } }, { label: t('col.name'), render: function (r) { return r.problem_description; } },
            { label: t('col.status'), render: function (r) { return r.status; } }], 4);
        }, function (er) { E.clear(into); into.appendChild(h('div', { class: 'notice bad' }, E.errText(er))); });
      }

      var foot = [E.btn(t('c.close'), { onclick: function () { modal.close(); } })];
      if (!deleted && E.can('equipment.delete')) foot.unshift(E.btn(t('c.delete'), { icon: 'trash', cls: 'danger', onclick: function () { openDelete(e, function () { modal.close(); if (onChanged) onChanged(); }); } }));
      if (!deleted && E.can('equipment.update')) foot.push(E.btn(t('c.edit'), { icon: 'edit', cls: 'primary', onclick: function () { modal.close(); openForm(e, function () { if (onChanged) onChanged(); openDetail(id, false, onChanged); }); } }));
      if (deleted && E.can('equipment.restore')) foot.push(E.btn(t('c.restore'), { cls: 'primary', onclick: function () {
        E.api('equipment.restore', { equipment_id: id }).then(function () { E.toast(t('eq.restored'), 'ok'); modal.close(); if (onChanged) onChanged(); }, E.fail);
      } }));

      var body = h('div', null,
        scan ? h('div', { class: 'notice', style: 'margin-bottom:12px' }, h('b', null, t('eq.scan_t')), h('div', null, t('eq.scan_b'))) : null,
        top, tabsEl, panel);
      modal = E.openModal({ title: e.equipment_id, body: body, footer: foot, wide: true, noFocus: true });
      drawTabs(); loadPhoto();
    }, function (er) {
      if (er && er.code === 'NOT_FOUND') E.toast(t('eq.not_found', { id: id }), 'bad'); else E.fail(er);
    });
  }

  // ------------------------------------------------------------------ Form tambah / ubah
  function openForm(eq, onSaved) {
    var m = E.S.master, isEdit = !!eq, v = eq || { condition: 'Good', status: 'Normal' };
    var cats = m.categories.filter(function (c) { return c.status === 'Active' || (isEdit && c.category_id === eq.category_id); });
    var blds = m.buildings.filter(function (b) { return b.status === 'Active' || (isEdit && b.building_id === eq.building_id); });
    function locsFor(bid) {
      return m.locations.filter(function (l) { return l.building_id === bid && (l.status === 'Active' || (isEdit && l.location_id === eq.location_id)); })
        .map(function (l) { return [l.location_id, l.location_name]; });
    }
    var form = E.buildForm([
      { k: 'equipment_name', req: true, max: 120, span: 2 },
      { k: 'category_id', type: 'select', req: true, options: cats.map(function (c) { return [c.category_id, E.catLabel(c)]; }) },
      { k: 'building_id', type: 'select', req: true, options: blds.map(function (b) { return [b.building_id, b.building_name]; }),
        onChange: function (val, f) { f.setOptions(f.inputs.location_id, locsFor(val), ''); f.inputs.production_area.value = ''; } },
      { k: 'location_id', type: 'select', req: true, options: locsFor(v.building_id || ''),
        onChange: function (val, f) { var l = E.locById(val); if (l && !f.inputs.production_area.value) f.inputs.production_area.value = l.production_area || ''; } },
      { k: 'production_area', max: 80 },
      { k: 'brand', max: 80 }, { k: 'model', max: 80 }, { k: 'serial_number', max: 80 },
      { k: 'electrical_spec', max: 200, span: 2 },
      { k: 'voltage', max: 40, ph: '400 V' }, { k: 'current', max: 40, ph: '630 A' }, { k: 'power_rating', max: 40, ph: '15 kW' },
      { k: 'installation_date', type: 'date' }, { k: 'commissioning_date', type: 'date' },
      { k: 'condition', type: 'select', req: true, blank: false, options: ['Good', 'Fair', 'Poor', 'Critical'].map(function (c) { return [c, t('cond.' + c)]; }) },
      { k: 'status', type: 'select', req: true, blank: false, options: ['Normal', 'Warning', 'Breakdown'].map(function (s) { return [s, t('st.' + s)]; }) },
      { k: 'notes', type: 'textarea', max: 1000, span: 2 }
    ], v);
    var save = E.btn(t('c.save'), { cls: 'primary', type: 'button' });
    var cancel = E.btn(t('c.cancel'), { onclick: function () { modal.close(); } });
    var modal = E.openModal({ title: isEdit ? t('eq.edit') + ' · ' + eq.equipment_id : t('eq.add'), body: form.el, footer: [cancel, save], wide: true });
    save.addEventListener('click', function () {
      if (!form.validate()) return;
      var p = form.get();
      if (isEdit) { p.equipment_id = eq.equipment_id; p.expected_updated_at = eq.updated_at; }
      save.disabled = true;
      E.api(isEdit ? 'equipment.update' : 'equipment.create', p).then(function (r) {
        E.toast(isEdit ? t('eq.saved') : t('eq.created', { id: r.equipment_id }), 'ok');
        modal.close(); if (onSaved) onSaved(r);
      }, function (er) { save.disabled = false; if (!form.showServerError(er)) E.fail(er); });
    });
  }

  // ------------------------------------------------------------------ Hapus aman
  function openDelete(eq, done) {
    var reason = h('textarea', { rows: 3, maxlength: 300, 'aria-label': t('eq.del_reason') });
    var confirm = h('input', { type: 'text', autocomplete: 'off', spellcheck: 'false', 'aria-label': t('eq.del_confirm', { id: eq.equipment_id }) });
    var go = E.btn(t('c.delete'), { cls: 'danger solid', disabled: true });
    var cancel = E.btn(t('c.cancel'), { onclick: function () { modal.close(); } });
    function check() { go.disabled = !(reason.value.trim().length >= 5 && confirm.value.trim().toUpperCase() === eq.equipment_id); }
    reason.addEventListener('input', check); confirm.addEventListener('input', check);
    var body = h('div', { class: 'stack' },
      h('div', { class: 'notice warn' }, t('eq.del_body')),
      h('div', { class: 'field' }, h('label', null, t('eq.del_reason')), reason),
      h('div', { class: 'field' }, h('label', null, t('eq.del_confirm', { id: eq.equipment_id })), confirm));
    var modal = E.openModal({ title: t('eq.del_title') + ' · ' + eq.equipment_id, body: body, footer: [cancel, go] });
    go.addEventListener('click', function () {
      go.disabled = true;
      E.api('equipment.delete', { equipment_id: eq.equipment_id, reason: reason.value.trim(), confirm: confirm.value.trim() }).then(function () {
        E.toast(t('eq.del_done'), 'ok'); modal.close(); if (done) done();
      }, function (er) { go.disabled = false; E.fail(er); });
    });
  }

  E.pages.equipment = { render: render };
})();
</script>
