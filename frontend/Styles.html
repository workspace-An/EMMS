<style>
:root{
  --navy:#0b2a4a;--navy2:#123a63;--blue:#1e6fd9;--blue-d:#1757ad;--bg:#f3f5f8;--card:#fff;--text:#1e293b;--muted:#64748b;
  --line:#e2e8f0;--ok:#15803d;--ok-bg:#dcfce7;--warn:#b45309;--warn-bg:#fef3c7;--bad:#b91c1c;--bad-bg:#fee2e2;--info-bg:#dbeafe;--gray-bg:#e2e8f0;
  --r:10px;--sh:0 1px 2px rgba(15,23,42,.06),0 1px 3px rgba(15,23,42,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans","Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;font-size:14px;color:var(--text);background:var(--bg);-webkit-text-size-adjust:100%}
h1,h2,h3{margin:0;font-weight:650}
button,input,select,textarea{font:inherit;color:inherit}
.ic{width:18px;height:18px;flex:none;vertical-align:-3px}
#loadbar{position:fixed;left:0;top:0;height:3px;width:0;background:var(--blue);z-index:3000;transition:width .3s}
#loadbar.on{width:85%;transition:width 8s cubic-bezier(.1,.7,.3,1)}

/* layout */
.app{display:flex;min-height:100vh}
.side{width:248px;background:var(--navy);color:#cbd5e1;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:200;transition:transform .2s}
.brand{display:flex;gap:10px;align-items:center;padding:18px 18px 14px;color:#fff}
.logo{width:34px;height:34px;border-radius:9px;background:var(--blue);display:grid;place-items:center;color:#fff}
.brand b{display:block;font-size:17px;letter-spacing:.5px}
.brand small{display:block;font-size:11px;color:#94a3b8;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{flex:1;overflow:auto;padding:6px 10px}
.nav a{display:flex;gap:11px;align-items:center;padding:10px 12px;border-radius:8px;color:#cbd5e1;text-decoration:none;cursor:pointer;margin:2px 0;font-size:14px}
.nav a:hover{background:rgba(255,255,255,.07)}
.nav a.on{background:var(--blue);color:#fff}
.nav a .soon{margin-left:auto;font-size:10px;background:rgba(255,255,255,.12);padding:1px 6px;border-radius:9px;color:#94a3b8}
.nav hr{border:0;border-top:1px solid rgba(255,255,255,.1);margin:8px 6px}
.side-foot{padding:12px 18px;font-size:11px;color:#64748b}
.main{margin-left:248px;flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 20px;position:sticky;top:0;z-index:100}
.top h2{font-size:17px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.burger{display:none}
.user-chip{display:flex;align-items:center;gap:9px;padding:4px 6px 4px 4px;border-radius:30px;cursor:default}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px}
.user-chip .who{line-height:1.2;font-size:12.5px}
.user-chip .who b{display:block;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-chip .who span{color:var(--muted);font-size:11.5px}
.content{padding:22px;max-width:1500px;width:100%;margin:0 auto}
.scrim{display:none}

/* controls */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:550;white-space:nowrap;line-height:1.25}
.btn:hover{background:#f8fafc}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.primary:hover{background:var(--blue-d)}
.btn.danger{background:#fff;color:var(--bad);border-color:#fecaca}.btn.danger:hover{background:var(--bad-bg)}
.btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:5px 9px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{border:0;background:transparent;cursor:pointer;padding:6px;border-radius:6px;color:var(--muted);line-height:0}
.icon-btn:hover{background:#eef2f7;color:var(--text)}
input[type=text],input[type=email],input[type=date],input[type=search],input[type=tel],select,textarea{width:100%;padding:8px 10px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;min-height:38px}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid #bfdbfe;border-color:var(--blue)}
input[readonly]{background:#f1f5f9}
select.mini{width:auto;min-height:34px;padding:5px 8px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12.5px;font-weight:600;color:#475569}
.field .req{color:var(--bad);font-style:normal}
.field .ferr{color:var(--bad);font-size:12px;min-height:0}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--bad);background:#fff7f7}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 14px}
.grid .full{grid-column:1/-1}

/* cards + stats */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--line)}
.card-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;font-weight:650}
.card-b{padding:16px}
.page-head{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.page-head h1{font-size:20px;flex:1;min-width:160px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-bottom:16px}
.stat{padding:14px 16px;display:flex;gap:12px;align-items:center}
.stat .ico{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;background:var(--info-bg);color:var(--blue);flex:none}
.stat.ok .ico{background:var(--ok-bg);color:var(--ok)}.stat.warn .ico{background:var(--warn-bg);color:var(--warn)}.stat.bad .ico{background:var(--bad-bg);color:var(--bad)}
.stat .v{font-size:25px;font-weight:700;line-height:1.1}
.stat .l{font-size:12.5px;color:var(--muted)}
.stat .ph{font-size:10px;background:var(--gray-bg);color:#475569;border-radius:8px;padding:0 6px;margin-left:6px;vertical-align:2px}
.two{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:14px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}

/* toolbar + table */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.toolbar .grow{flex:1;min-width:200px}
.table-wrap{overflow:auto;border-radius:var(--r)}
table{width:100%;border-collapse:collapse;background:#fff}
th{position:sticky;top:0;background:#f8fafc;text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.3px;color:#475569;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid #eef2f7;vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:#f8fbff}
td .sub{color:var(--muted);font-size:12px}
td.num,th.num{text-align:right}
.actions{display:flex;gap:4px;justify-content:flex-end}
.pager{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 4px;color:var(--muted);font-size:13px;flex-wrap:wrap}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)}.b-warn{background:var(--warn-bg);color:var(--warn)}.b-bad{background:var(--bad-bg);color:var(--bad)}
.b-info{background:var(--info-bg);color:var(--blue-d)}.b-gray{background:var(--gray-bg);color:#475569}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow:auto}
.tabs button{border:0;background:none;padding:9px 14px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--blue);border-color:var(--blue)}

/* modal */
.modal-back{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto;z-index:1000}
.modal{background:#fff;border-radius:12px;width:100%;max-width:720px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal.sm{max-width:480px}.modal.lg{max-width:940px}
.modal-h{display:flex;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-h h3{flex:1;font-size:16px}
.modal-b{padding:18px}
.modal-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;background:#f8fafc;border-radius:0 0 12px 12px}
#toast-root{position:fixed;right:14px;bottom:14px;z-index:2000;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 28px)}
.toast{background:var(--navy);color:#fff;padding:10px 14px;border-radius:9px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:420px;font-size:13.5px}
.toast.err{background:#991b1b}.toast.ok{background:#166534}

/* detail */
.dl{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 18px}
.dl div{min-width:0}.dl dt{font-size:12px;color:var(--muted)}.dl dd{margin:1px 0 0;font-weight:550;word-break:break-word}
.dl .full{grid-column:1/-1}
.hero{display:flex;gap:16px;margin-bottom:14px;align-items:flex-start}
.photo{width:150px;height:112px;border-radius:9px;background:#eef2f7;border:1px solid var(--line);display:grid;place-items:center;color:#94a3b8;overflow:hidden;flex:none;font-size:12px}
.photo img{width:100%;height:100%;object-fit:cover}
.hero h3{font-size:18px}.hero .meta{color:var(--muted);margin-top:3px}
.qrbox{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.qrbox .qr{width:200px;height:200px;border:1px solid var(--line);border-radius:8px;padding:6px;background:#fff}
.qrbox .qr svg{width:100%;height:100%;display:block}
.url{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;word-break:break-all;background:#f1f5f9;padding:8px;border-radius:6px}
.notice{padding:10px 12px;border-radius:8px;background:var(--warn-bg);color:#78350f;font-size:13px;margin-bottom:12px}
.notice.info{background:var(--info-bg);color:#1e3a8a}
.preview{max-width:160px;max-height:120px;border-radius:8px;margin-top:6px;border:1px solid var(--line)}

/* charts */
.donut{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.donut svg{width:140px;height:140px;flex:none}
.legend{display:flex;flex-direction:column;gap:6px;font-size:13px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px}
.hbar{display:grid;grid-template-columns:minmax(80px,38%) 1fr 34px;gap:8px;align-items:center;margin:7px 0;font-size:13px}
.hbar .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .bar{background:#eef2f7;height:12px;border-radius:7px;overflow:hidden}
.hbar .bar i{display:block;height:100%;background:var(--blue);border-radius:7px}
.hbar b{text-align:right}
.chart-svg{width:100%;height:auto}
.muted{color:var(--muted)}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,var(--navy) 0%,var(--navy2) 55%,#1e4a7a 100%)}
.login-card{background:#fff;border-radius:14px;width:100%;max-width:410px;padding:28px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.login-brand{text-align:center;margin-bottom:18px}
.login-brand .logo{margin:0 auto 10px;width:48px;height:48px;border-radius:12px}
.login-brand h1{font-size:22px;letter-spacing:1px;color:var(--navy)}
.login-brand p{margin:4px 0 0;color:var(--muted);font-size:13px}
.login-card .btn.primary{width:100%;justify-content:center;padding:10px;margin-top:12px}
.login-card .links{display:flex;justify-content:space-between;margin-top:12px;font-size:13px}
.login-card a{color:var(--blue);cursor:pointer;text-decoration:none}
.login-card .note{margin-top:16px;font-size:12px;color:var(--muted);text-align:center}
.codein{text-align:center;font-size:26px!important;letter-spacing:10px;font-weight:700}
.lang{display:flex;gap:6px;justify-content:center;margin-top:16px}
.lang button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:3px 11px;cursor:pointer;font-size:12.5px}
.lang button.on{background:var(--navy);color:#fff;border-color:var(--navy)}

/* labels print */
.label-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.label{border:1px dashed #94a3b8;border-radius:6px;padding:8px;display:flex;gap:8px;align-items:center;break-inside:avoid;background:#fff}
.label .q{width:86px;height:86px;flex:none}.label .q svg{width:100%;height:100%}
.label b{display:block;font-size:14px}.label span{display:block;font-size:11.5px;color:#334155;line-height:1.3}
.label small{display:block;font-size:10px;color:#64748b;margin-top:3px}


/* inspeksi */
.progress{height:10px;background:#e2e8f0;border-radius:6px;overflow:hidden;margin:6px 0 12px}
.progress i{display:block;height:100%;background:var(--ok);border-radius:6px}
.ci{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:#fff}
.ci.invalid{border-color:var(--bad);background:#fff7f7}
.ci.ng{border-color:#f59e0b;background:#fffbeb}.ci.crit.ng{border-color:var(--bad);background:#fef2f2}
.ci-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.ci-h b{flex:1;min-width:150px}
.seg{display:inline-flex;border:1px solid #cbd5e1;border-radius:9px;overflow:hidden}
.seg button{border:0;background:#fff;padding:9px 18px;cursor:pointer;font-weight:650;min-width:58px;border-right:1px solid #cbd5e1}
.seg button:last-child{border-right:0}
.seg button.on[data-r=OK]{background:var(--ok);color:#fff}
.seg button.on[data-r=NG]{background:#d97706;color:#fff}
.seg button.on[data-r=NA]{background:#64748b;color:#fff}
.ci .mrow{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}
.ci .mrow input{max-width:150px}
.ci .hint{font-size:12px;color:var(--muted)}.ci .hint.bad{color:var(--bad);font-weight:600}
.ngbox{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.sumbar{position:sticky;top:0;z-index:5;background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:8px 12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.thumb{max-width:100%;max-height:60vh;border-radius:8px;border:1px solid var(--line)}
.block{background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px}
.block h4{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted)}

@media (max-width:1100px){.three{grid-template-columns:1fr 1fr}}
@media (max-width:900px){
  .side{transform:translateX(-100%)}
  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:150}
  .main{margin-left:0}
  .burger{display:inline-flex}
  .content{padding:14px}
  .two,.three{grid-template-columns:1fr}
  .user-chip .who{display:none}
  #langsel{max-width:96px}
  .hide-sm{display:none}
}
@media (max-width:560px){
  .grid,.dl{grid-template-columns:1fr}
  .hero{flex-direction:column}
  .photo{width:100%;height:150px}
  .cards{grid-template-columns:1fr 1fr;gap:10px}
  .stat{padding:11px;gap:9px}.stat .ico{width:34px;height:34px}.stat .v{font-size:21px}
  .modal-back{padding:0}.modal{border-radius:0;min-height:100vh;max-width:none}
  .modal-f{position:sticky;bottom:0;border-radius:0}
  .toolbar select{flex:1 1 45%}
  .btn{padding:9px 12px}
}
@media print{
  @page{margin:8mm}
  body.printing{background:#fff}
  body.printing #root,body.printing #toast-root,body.printing #loadbar{display:none!important}
  body.printing .modal-back{position:static;background:none;padding:0;display:block;overflow:visible}
  body.printing .modal{box-shadow:none;max-width:none;border-radius:0}
  body.printing .modal-h,body.printing .modal-f,body.printing .no-print{display:none!important}
  body.printing .modal-b{padding:0}
  body.printing .label-grid{grid-template-columns:repeat(3,1fr)}
}
</style>
