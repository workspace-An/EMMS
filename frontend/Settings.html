<script>
/* EMMS - Settings.html : Umum, Master Data, Audit Log, Sistem */
(function () {
  'use strict';
  var E = window.EMMS, esc = E.esc, t = E.t, S = E.S, $ = E.$, $$ = E.$$;

  // ---- konfigurasi UI master data
  function MD() {
    var m = S.master;
    var name = function (arr, k, n) { return function (id) { var x = arr.filter(function (r) { return r[k] === id; })[0]; return x ? x[n] : ''; }; };
    return {
      building: { title: 'settings.mdBuildings', rows: m.buildings, cols: [['BuildingName'], ['FactoryID', name(m.factories, 'FactoryID', 'FactoryName')], ['Description']],
        fields: [{ name: 'FactoryID', type: 'select', required: true, options: m.factories.map(function (f) { return { v: f.FactoryID, l: f.FactoryName }; }) }, { name: 'BuildingName', required: true }, { name: 'Description', type: 'textarea', full: true }], pk: 'BuildingID' },
      location: { title: 'settings.mdLocations', rows: m.locations, cols: [['LocationName'], ['BuildingID', name(m.buildings, 'BuildingID', 'BuildingName')], ['ProductionArea']],
        fields: [{ name: 'BuildingID', type: 'select', required: true, options: m.buildings.map(function (b) { return { v: b.BuildingID, l: b.BuildingName }; }) }, { name: 'LocationName', required: true }, { name: 'ProductionArea' }, { name: 'Description', type: 'textarea', full: true }], pk: 'LocationID' },
      category: { title: 'settings.mdCategories', rows: m.categories, cols: [['CategoryName'], ['Code'], ['Description']],
        fields: [{ name: 'CategoryName', required: true, full: true }, { name: 'Code', required: true, max: 12 }, { name: 'InspectionType' }, { name: 'Description', type: 'textarea', full: true }], pk: 'CategoryID' },
      factory: { title: 'settings.mdFactories', rows: m.factories, cols: [['FactoryName'], ['Address'], ['Description']],
        fields: [{ name: 'FactoryName', required: true, full: true }, { name: 'Address', full: true }, { name: 'Description', type: 'textarea', full: true }], pk: 'FactoryID' }
    };
  }

  function mdForm(ent, cfg, rec, done) {
    var edit = !!rec, v = rec || {};
    var save = E.btn(t('common.save'), 'primary', function () {
      var data = E.readForm(m.body); if (edit) { data[cfg.pk] = rec[cfg.pk]; data.UpdatedAt = rec.UpdatedAt; }
      save.disabled = true;
      E.api('master.save', { entity: ent, data: data }).then(function () { return E.reloadMaster(); }).then(function () { m.close(); E.toast(t('common.saved'), 'ok'); done(); })
        .catch(function (x) { save.disabled = false; if (!E.markErrors(m.body, x)) E.toast(E.errText(x), 'err'); });
    });
    var m = E.modal({ title: t(cfg.title), size: 'sm', body: '<div class="grid">' + cfg.fields.map(function (f) { return E.fieldHtml(f, v[f.name]); }).join('') + '</div>', footer: [E.btn(t('common.cancel'), '', function () { m.close(); }), save] });
  }

  function tabMaster(box) {
    var cur = 'building', manage = E.can('master.manage');
    function draw() {
      var all = MD(), cfg = all[cur];
      box.innerHTML = '<div class="toolbar">' + ['building', 'location', 'category', 'factory'].map(function (k) { return '<button class="btn sm' + (k === cur ? ' primary' : '') + '" data-k="' + k + '">' + esc(t(all[k].title)) + '</button>'; }).join('') +
        '<span class="grow"></span><span id="mdadd"></span></div><div class="card"><div class="table-wrap"><table><thead><tr>' + cfg.cols.map(function (c) { return '<th>' + esc(t('f.' + c[0])) + '</th>'; }).join('') + '<th></th></tr></thead><tbody>' +
        (cfg.rows.length ? cfg.rows.map(function (r, i) {
          return '<tr>' + cfg.cols.map(function (c) { return '<td>' + esc(c[1] ? c[1](r[c[0]]) : r[c[0]]) + '</td>'; }).join('') + '<td class="actions">' + (manage ? '<button class="icon-btn" data-e="' + i + '">' + E.ic('edit') + '</button><button class="icon-btn" data-d="' + i + '">' + E.ic('trash') + '</button>' : '') + '</td></tr>';
        }).join('') : '<tr><td class="empty" colspan="9">' + esc(t('common.noData')) + '</td></tr>') + '</tbody></table></div></div>';
      $$('[data-k]', box).forEach(function (b) { b.onclick = function () { cur = b.dataset.k; draw(); }; });
      if (manage) {
        $('#mdadd', box).appendChild(E.btn(t('common.add'), 'primary', function () { mdForm(cur, cfg, null, draw); }, 'plus'));
        $$('[data-e]', box).forEach(function (b) { b.onclick = function () { mdForm(cur, cfg, cfg.rows[+b.dataset.e], draw); }; });
        $$('[data-d]', box).forEach(function (b) {
          b.onclick = function () {
            var r = cfg.rows[+b.dataset.d];
            E.confirmDlg({ title: t('common.delete'), message: t('settings.mdDeleteMsg'), danger: true, confirmLabel: t('common.delete') }).then(function (ok) {
              if (!ok) return;
              E.api('master.delete', { entity: cur, id: r[cfg.pk] }).then(function () { return E.reloadMaster(); }).then(function () { E.toast(t('common.saved'), 'ok'); draw(); })
                .catch(function (x) { E.toast(E.errText(x), 'err'); });
            });
          };
        });
      }
    }
    draw();
  }

  function tabGeneral(box) {
    var edit = E.can('settings.edit');
    E.api('settings.get', {}).then(function (d) {
      var v = d.values, langs = [{ v: 'id', l: 'Bahasa Indonesia' }, { v: 'en', l: 'English' }, { v: 'zh', l: '中文' }], tf = [{ v: 'TRUE', l: t('common.yes') }, { v: 'FALSE', l: t('common.no') }];
      var warn = d.detectedUrl && v.WEBAPP_URL && d.detectedUrl !== v.WEBAPP_URL ? '<div class="notice">' + esc(t('settings.urlMismatch', { url: d.detectedUrl })) + '</div>' : '';
      box.innerHTML = warn + '<div class="card"><div class="card-b"><div class="grid">' + [
        { name: 'COMPANY_NAME', required: true, full: true }, { name: 'COMPANY_ADDRESS', full: true }, { name: 'DEFAULT_LANGUAGE', type: 'select', options: langs },
        { name: 'SESSION_DAYS', inputmode: 'numeric' }, { name: 'ALLOW_GOOGLE_AUTOLOGIN', type: 'select', options: tf }, { name: 'PM_LEAD_DAYS', inputmode: 'numeric' }, { name: 'PM_CALENDAR_ENABLED', type: 'select', options: tf }, { name: 'WEBAPP_URL', full: true, max: 300 }
      ].map(function (f) { if (!edit) f.readonly = f.disabled = true; return E.fieldHtml(f, v[f.name]); }).join('') + '</div><p class="muted">' + esc(t('settings.urlHelp')) + (d.detectedUrl && !v.WEBAPP_URL ? ' <a id="useurl" style="color:var(--blue);cursor:pointer">' + esc(t('settings.useDetected')) + '</a>' : '') + '</p><div id="sgbtn"></div></div></div>';
      if ($('#useurl', box)) $('#useurl', box).onclick = function () { $('[name=WEBAPP_URL]', box).value = d.detectedUrl; };
      if (edit) {
        var b = E.btn(t('common.save'), 'primary', function () {
          b.disabled = true;
          E.api('settings.update', E.readForm(box)).then(function (r) {
            b.disabled = false; S.settings.COMPANY_NAME = r.values.COMPANY_NAME; S.settings.COMPANY_ADDRESS = r.values.COMPANY_ADDRESS; if (r.values.WEBAPP_URL) S.webAppUrl = r.values.WEBAPP_URL; E.toast(t('common.saved'), 'ok');
          }).catch(function (x) { b.disabled = false; if (!E.markErrors(box, x)) E.toast(E.errText(x), 'err'); });
        });
        $('#sgbtn', box).appendChild(b);
      }
    }).catch(function (x) { box.innerHTML = '<div class="notice">' + esc(E.errText(x)) + '</div>'; });
  }

  function tabAudit(box) {
    E.api('audit.list', { limit: 200 }).then(function (rows) {
      box.innerHTML = '<div class="card"><div class="table-wrap"><table><thead><tr><th>' + esc(t('audit.time')) + '</th><th>' + esc(t('f.Email')) + '</th><th>' + esc(t('audit.action')) + '</th><th>' + esc(t('audit.entity')) + '</th><th class="hide-sm">' + esc(t('audit.details')) + '</th><th>' + esc(t('audit.result')) + '</th></tr></thead><tbody>' +
        (rows.length ? rows.map(function (a) {
          return '<tr><td class="sub" style="white-space:nowrap">' + esc(E.fmtDT(a.EventTime)) + '</td><td>' + esc(a.UserEmail) + '</td><td><b>' + esc(a.Action) + '</b></td><td>' + esc(a.Entity + ' ' + a.EntityID) + '</td><td class="hide-sm sub" style="max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + esc(a.Details) + '">' + esc(a.Details) + '</td><td>' + E.badge(a.Result === 'OK' ? 'ok' : 'bad', a.Result) + '</td></tr>';
        }).join('') : '<tr><td colspan="6" class="empty">' + esc(t('common.noData')) + '</td></tr>') + '</tbody></table></div></div>';
    }).catch(function (x) { box.innerHTML = '<div class="notice">' + esc(E.errText(x)) + '</div>'; });
  }

  function healthCard(box) {
    function run() {
      box.innerHTML = '<div class="card"><div class="card-b"><h3>' + esc(t('health.title')) + '</h3><div class="empty">' + esc(t('common.loading')) + '</div></div></div>';
      E.api('system.health', {}).then(function (h) {
        var lv = { ok: 'ok', warn: 'warn', bad: 'bad' };
        box.innerHTML = '<div class="card"><div class="card-b"><h3>' + esc(t('health.title')) + ' ' + E.badge(lv[h.status], t('health.' + h.status)) + '</h3><div class="table-wrap"><table><tbody>' +
          h.checks.map(function (c) { return '<tr><td style="width:34px">' + E.badge(lv[c.level], c.level === 'ok' ? '✓' : (c.level === 'warn' ? '!' : '✗')) + '</td><td><b>' + esc(t('health.c.' + c.key)) + '</b><div class="sub">' + esc(c.detail) + '</div></td></tr>'; }).join('') +
          '</tbody></table></div><div id="hbtn" style="margin-top:8px"></div></div></div>';
        $('#hbtn', box).appendChild(E.btn(t('health.recheck'), '', run, 'check'));
      }).catch(function (x) { box.innerHTML = '<div class="notice">' + esc(E.errText(x)) + '</div>'; });
    }
    run();
  }

  function backupCard(box) {
    function run() {
      E.api('backup.list', {}).then(function (b) {
        var edit = E.can('system.manage');
        box.innerHTML = '<div class="card"><div class="card-b"><h3>' + esc(t('backup.title')) + '</h3><p class="muted">' + esc(t('backup.desc')) + '</p>' +
          '<div class="table-wrap"><table><thead><tr><th>' + esc(t('f.Date')) + '</th><th>' + esc(t('backup.name')) + '</th><th>' + esc(t('backup.by')) + '</th></tr></thead><tbody>' +
          (b.rows.length ? b.rows.map(function (r) { return '<tr><td class="sub" style="white-space:nowrap">' + esc(E.fmtDT(r.at)) + '</td><td>' + esc(r.name) + '</td><td>' + esc(r.by) + ' <span class="sub">' + esc(r.reason) + '</span></td></tr>'; }).join('') : '<tr><td colspan="3" class="empty">' + esc(t('backup.none')) + '</td></tr>') + '</tbody></table></div>' +
          (edit ? '<div class="grid" id="bfrm" style="margin-top:10px">' + E.fieldHtml({ name: 'BACKUP_AUTO', type: 'select', options: [{ v: 'TRUE', l: t('auto.on') }, { v: 'FALSE', l: t('auto.off') }] }, b.auto ? 'TRUE' : 'FALSE') + E.fieldHtml({ name: 'BACKUP_KEEP', max: 2 }, String(b.keep)) + '</div><div id="bbtn" style="margin-top:8px"></div>' : '') + '</div></div>';
        if (edit) {
          var bar = $('#bbtn', box);
          bar.appendChild(E.btn(t('common.save'), 'primary', function () {
            E.api('backup.configure', E.readForm($('#bfrm', box))).then(function () { E.toast(t('common.saved'), 'ok'); run(); }).catch(function (e) { if (!E.markErrors($('#bfrm', box), e)) E.toast(E.errText(e), 'err'); });
          }, 'check'));
          bar.appendChild(document.createTextNode(' '));
          var go = E.btn(t('backup.now'), '', function () {
            go.disabled = true;
            E.api('backup.create', {}).then(function (r) { E.toast(t('backup.done', { name: r.name }), 'ok'); run(); }).catch(function (e) { go.disabled = false; E.toast(E.errText(e), 'err'); });
          }, 'download');
          bar.appendChild(go);
        }
      }).catch(function (x) { box.innerHTML = '<div class="notice">' + esc(E.errText(x)) + '</div>'; });
    }
    run();
  }

  function tabSystem(box) {
    E.api('settings.diagnose', {}).then(function (d) {
      var row = function (k, v) { return '<div><dt>' + esc(k) + '</dt><dd>' + v + '</dd></div>'; };
      box.innerHTML = '<div class="card"><div class="card-b"><dl class="dl">' + row('Version', esc((window.__BOOT || {}).version)) +
        row(t('sys.activeEmail'), d.activeUserEmailAvailable ? E.badge('ok', t('common.yes')) : E.badge('gray', t('common.no'))) + row(t('sys.mode'), esc(d.recommendedMode)) +
        row(t('sys.mailQuota'), esc(d.mailQuotaRemaining)) + row(t('sys.autologin'), esc(d.autoLoginSetting)) + row('Web App URL', esc(S.webAppUrl || '-')) + '</dl><p class="muted">' + esc(t('sys.note')) + '</p></div></div>' +
        '<div id="shealth" style="margin-top:12px"></div><div id="sbackup" style="margin-top:12px"></div>';
      healthCard($('#shealth', box)); backupCard($('#sbackup', box));
    }).catch(function (x) { box.innerHTML = '<div class="notice">' + esc(E.errText(x)) + '</div>'; });
  }

  function tabAutomation(box) {
    Promise.all([E.api('automation.status', {}), E.api('notifications.list', {})]).then(function (r) {
      var st = r[0], nt = r[1].rows, edit = E.can('automation.manage');
      var last = st.last;
      var html = '<div class="card"><div class="card-b"><h3>' + esc(t('auto.title')) + '</h3><p class="muted">' + esc(t('auto.desc')) + '</p><dl class="dl">' +
        '<div><dt>' + esc(t('auto.status')) + '</dt><dd>' + (st.enabled && st.triggerInstalled ? E.badge('ok', t('auto.on')) : (st.enabled ? E.badge('warn', t('auto.noTrigger')) : E.badge('gray', t('auto.off')))) + '</dd></div>' +
        '<div><dt>' + esc(t('sys.mailQuota')) + '</dt><dd>' + esc(st.mailQuota === null ? '-' : st.mailQuota) + '</dd></div>' +
        '<div style="grid-column:1/-1"><dt>' + esc(t('auto.lastRun')) + '</dt><dd>' + (last ? esc(E.fmtDT(last.finishedAt)) + ' · ' + esc(t('auto.lastSummary', { sent: last.sent, failed: last.failed, skipped: last.skipped })) + (last.quotaStop ? ' · ' + esc(t('auto.quotaStop')) : '') + (last.errors && last.errors.length ? ' · ' + E.badge('bad', last.errors[0]) : '') : esc(t('auto.never'))) + '</dd></div></dl>';
      if (edit) {
        html += '<div class="grid" id="afrm">' + E.fieldHtml({ name: 'AUTOMATION_ENABLED', type: 'select', options: [{ v: 'TRUE', l: t('auto.on') }, { v: 'FALSE', l: t('auto.off') }] }, st.enabled ? 'TRUE' : 'FALSE') +
          E.fieldHtml({ name: 'AUTOMATION_HOUR', max: 2 }, String(st.hour)) + E.fieldHtml({ name: 'OVERDUE_DAYS', max: 2 }, String(st.overdueDays)) + E.fieldHtml({ name: 'SAFETY_ESCALATE_DAYS', max: 2 }, String(st.safetyDays)) + '</div>' +
          '<div style="margin-top:10px" id="abtn"></div><p class="muted">' + esc(t('auto.help')) + '</p>';
      }
      html += '</div></div><div class="card" style="margin-top:12px"><div class="card-b"><h3>' + esc(t('auto.notifLog')) + '</h3><div class="table-wrap"><table><thead><tr><th>' + esc(t('f.Date')) + '</th><th>' + esc(t('f.Type')) + '</th><th>' + esc(t('auto.to')) + '</th><th>' + esc(t('f.Status')) + '</th></tr></thead><tbody>' +
        (nt.length ? nt.slice(0, 50).map(function (n) { return '<tr><td class="sub" style="white-space:nowrap">' + esc(E.fmtDT(n.SentAt)) + '</td><td>' + esc(n.Type) + '</td><td>' + esc(n.To) + '</td><td>' + E.badge(n.Status === 'Sent' ? 'ok' : 'bad', n.Status) + (n.Error ? '<div class="sub">' + esc(n.Error) + '</div>' : '') + '</td></tr>'; }).join('') : '<tr><td colspan="4" class="empty">' + esc(t('common.noData')) + '</td></tr>') + '</tbody></table></div></div></div>';
      box.innerHTML = html;
      if (edit) {
        var bar = $('#abtn', box);
        bar.appendChild(E.btn(t('common.save'), 'primary', function () {
          E.api('automation.configure', E.readForm($('#afrm', box))).then(function () { E.toast(t('common.saved'), 'ok'); tabAutomation(box); }).catch(function (e) { if (!E.markErrors($('#afrm', box), e)) E.toast(E.errText(e), 'err'); });
        }, 'check'));
        bar.appendChild(document.createTextNode(' '));
        bar.appendChild(E.btn(t('auto.preview'), '', function () {
          E.api('automation.runNow', { dryRun: true }).then(function (r) { E.toast(t('auto.previewResult', { n: r.sent, e: r.empty })); }).catch(function (e) { E.toast(E.errText(e), 'err'); });
        }));
        bar.appendChild(document.createTextNode(' '));
        bar.appendChild(E.btn(t('auto.runNow'), '', function () {
          E.confirmDlg({ title: t('auto.runNow'), message: t('auto.runConfirm'), confirmLabel: t('auto.runNow') }).then(function (ok) {
            if (ok) E.api('automation.runNow', { force: true }).then(function (r) { E.toast(t('auto.lastSummary', { sent: r.sent, failed: r.failed, skipped: r.skipped }), r.failed ? 'err' : 'ok'); tabAutomation(box); }).catch(function (e) { E.toast(E.errText(e), 'err'); });
          });
        }));
      }
    }).catch(function (x) { box.innerHTML = '<div class="notice">' + esc(E.errText(x)) + '</div>'; });
  }

  function tabApprovals(box) {
    Promise.all([E.api('approvals.list', {}), E.can('automation.view') ? E.api('approvals.verify', {}) : Promise.resolve(null)]).then(function (r) {
      var rows = r[0].rows, v = r[1];
      box.innerHTML = '<div class="card"><div class="card-b">' + (v ? (v.invalid ? '<div class="notice" style="border-color:var(--red)">' + esc(t('appr.tampered', { n: v.invalid })) + ' ' + esc(v.ids.join(', ')) + '</div>' : '<div class="notice">' + esc(t('appr.allValid', { n: v.total })) + '</div>') : '') +
        '<div class="table-wrap"><table><thead><tr><th>' + esc(t('f.Date')) + '</th><th>' + esc(t('appr.ref')) + '</th><th>' + esc(t('appr.decision')) + '</th><th>' + esc(t('appr.by')) + '</th><th>' + esc(t('appr.sig')) + '</th></tr></thead><tbody>' +
        (rows.length ? rows.map(function (a) {
          return '<tr><td class="sub" style="white-space:nowrap">' + esc(E.fmtDT(a.At)) + '</td><td><b>' + esc(a.RefType) + '</b> ' + esc(a.RefID) + '<div class="sub">L' + esc(a.Level) + '</div></td><td>' + E.badge(a.Decision === 'Rejected' ? 'bad' : 'ok', a.Decision) + (a.Remarks ? '<div class="sub">' + esc(a.Remarks) + '</div>' : '') +
            '</td><td>' + esc(a.By) + '<div class="sub">' + esc(a.Role) + '</div></td><td class="sub"><code>' + esc(a.Signature) + '</code> ' + (a.Valid ? E.badge('ok', t('appr.valid')) : E.badge('bad', t('appr.invalid'))) + '</td></tr>';
        }).join('') : '<tr><td colspan="5" class="empty">' + esc(t('common.noData')) + '</td></tr>') + '</tbody></table></div></div></div>';
    }).catch(function (x) { box.innerHTML = '<div class="notice">' + esc(E.errText(x)) + '</div>'; });
  }

  E.pages.settings = {
    render: function (el) {
      var tabs = [['general', 'settings.general', tabGeneral], ['master', 'settings.master', tabMaster]];
      if (E.can('audit.view')) tabs.push(['audit', 'settings.audit', tabAudit]);
      if (E.can('automation.view')) tabs.push(['automation', 'settings.automation', tabAutomation]);
      if (E.can('approvals.view')) tabs.push(['approvals', 'settings.approvals', tabApprovals]);
      if (E.can('settings.edit')) tabs.push(['system', 'settings.system', tabSystem]);
      el.innerHTML = '<div class="page-head"><h1>' + esc(t('nav.settings')) + '</h1></div><div class="tabs">' + tabs.map(function (x) { return '<button data-t="' + x[0] + '">' + esc(t(x[1])) + '</button>'; }).join('') + '</div><div id="stab"></div>';
      function show(k) {
        $$('.tabs button', el).forEach(function (b) { b.classList.toggle('on', b.dataset.t === k); });
        var box = $('#stab', el); box.innerHTML = '<div class="empty">' + esc(t('common.loading')) + '</div>';
        tabs.filter(function (x) { return x[0] === k; })[0][2](box);
      }
      $$('.tabs button', el).forEach(function (b) { b.onclick = function () { show(b.dataset.t); }; });
      show((S.params && S.params.tab) || 'general');
    }
  };
})();
</script>
